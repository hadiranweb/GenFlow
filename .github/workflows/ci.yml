name: Build

on: [push]

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: |
          rustup toolchain install stable --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked 2>&1 | tail -20
        continue-on-error: true
      - run: cargo test --workspace --lib --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile 2>&1 | tail -5
        continue-on-error: true
      - run: pnpm --filter @genflow/web build 2>&1 | tail -20
        continue-on-error: true
