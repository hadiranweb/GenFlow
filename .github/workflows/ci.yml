# =============================================================================
# GenFlow v2 — CI/CD Pipeline
#
# Triggers:
#   push: main, main-platform, v2-*, arena/**
#   pull_request: main
#   schedule: weekly dependency audit
#
# Stages:
#   CI: Rust (lint → typecheck → test → build → audit → deny → coverage)
#   CI: Frontend (install → lint → typecheck → build)
#   CI: Docker (build API + Web images, multi-arch)
#   CD: Deploy to staging → production
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, main-platform, 'v2-*', 'arena/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # Every Monday 07:00 UTC — dependency audit
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# ============================================================
# Environment
# ============================================================
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0
  NODE_TELEMETRY_DISABLED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

# ============================================================
# Jobs
# ============================================================
jobs:

  # ============================================================
  # Rust — Formatting check
  # ============================================================
  rust-fmt:
    name: Rust — Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ============================================================
  # Rust — Lint (clippy)
  # ============================================================
  rust-clippy:
    name: Rust — Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ============================================================
  # Rust — Type check
  # ============================================================
  rust-check:
    name: Rust — Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo check --workspace --locked

  # ============================================================
  # Rust — Unit + doc tests
  # ============================================================
  rust-test:
    name: Rust — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Run unit tests
        run: cargo test --workspace --lib --locked
      - name: Run doc tests
        run: cargo test --workspace --doc --locked

  # ============================================================
  # Rust — Security audit (cargo audit)
  # ============================================================
  rust-audit:
    name: Rust — Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit --deny warnings

  # ============================================================
  # Rust — License & duplicate check (cargo deny)
  # ============================================================
  rust-deny:
    name: Rust — License Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses
        run: cargo deny check licenses
      - name: Check duplicates
        run: cargo deny check duplicates

  # ============================================================
  # Rust — Release build
  # ============================================================
  rust-build:
    name: Rust — Build (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-fmt, rust-clippy, rust-check, rust-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build release
        run: cargo build --release -p genflow-gateway --locked
      - name: Check binary
        run: |
          ls -lh target/release/genflow-api
          file target/release/genflow-api
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: genflow-api-binary
          path: target/release/genflow-api
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # Frontend — Install & Lint
  # ============================================================
  frontend-lint:
    name: Frontend — Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @genflow/web lint 2>/dev/null || echo "Lint not configured yet (skipping)"
        continue-on-error: true
      - name: TypeCheck
        run: pnpm --filter @genflow/web typecheck 2>/dev/null || echo "TypeCheck not configured yet (skipping)"
        continue-on-error: true

  # ============================================================
  # Frontend — Build
  # ============================================================
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @genflow/web build
        env:
          NODE_TELEMETRY_DISABLED: 1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: genflow-web-build
          path: apps/web/build/
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # Security — CodeQL Analysis
  # ============================================================
  security-codeql:
    name: Security — CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  # ============================================================
  # Docker — Build API image
  # ============================================================
  docker-api:
    name: Docker — API Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-build]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-platform' || startsWith(github.ref, 'refs/heads/v2-') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-platform' }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================
  # Docker — Build Web image
  # ============================================================
  docker-web:
    name: Docker — Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-build]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-platform' || startsWith(github.ref, 'refs/heads/v2-') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-platform' }}
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================
  # Docker — Security scan with Trivy
  # ============================================================
  docker-trivy:
    name: Security — Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-api, docker-web]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 1
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'trivy-api'
        continue-on-error: true
      - name: Run Trivy on Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 1
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'trivy-web'
        continue-on-error: true

# ============================================================
# CD Jobs (separate workflow file for deployment)
# See: .github/workflows/cd.yml
# ============================================================
