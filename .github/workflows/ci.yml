# =============================================================================
# GenFlow v2 — CI Pipeline (Rust + Frontend + Security + Docker)
#
# Triggers: push to main-platform, or manual via workflow_dispatch
# =============================================================================

name: CI

on:
  push:
    branches: [main-platform]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0
  NODE_TELEMETRY_DISABLED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:

  # ============================================================
  # Rust — Format + Clippy + Check
  # ============================================================
  rust-check:
    name: Rust — Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --locked

  # ============================================================
  # Rust — Tests (unit + doc)
  # ============================================================
  rust-test:
    name: Rust — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo test --workspace --lib --locked
      - run: cargo test --workspace --doc --locked

  # ============================================================
  # Rust — Security audit + License check
  # ============================================================
  rust-audit:
    name: Rust — Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # ============================================================
  # Rust — Release build
  # ============================================================
  rust-build:
    name: Rust — Build (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-check, rust-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo build --release -p genflow-gateway --locked
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: genflow-api-binary
          path: target/release/genflow-api
          retention-days: 7

  # ============================================================
  # Frontend — Build
  # ============================================================
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @genflow/web typecheck 2>/dev/null || true
      - run: pnpm --filter @genflow/web build
        env:
          NODE_TELEMETRY_DISABLED: 1

  # ============================================================
  # Docker — Build & Push API image
  # ============================================================
  docker-api:
    name: Docker — API Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Docker — Build & Push Web image
  # ============================================================
  docker-web:
    name: Docker — Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
