name: CD

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [main-platform]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions: write-all

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .

      - name: Deploy to server
        run: |
          echo "===== GenFlow Deployment ====="
          echo "Run: ./deploy/deploy.sh --prod"
          echo ""
          echo "Configure GitHub secrets for auto-deploy:"
          echo "  DEPLOY_SSH_KEY, STAGING_HOST, STAGING_USER"
          echo "  PROD_SSH_KEY, PRODUCTION_HOST, PRODUCTION_USER"
          echo ""
          echo "Build passed - ready for deployment"
