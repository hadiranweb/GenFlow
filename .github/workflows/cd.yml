name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, 'v2-*']

permissions:
  contents: read
  actions: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Docker/GHCR repository names must be lowercase.
  IMAGE_NAME: hadiranweb/genflow/genflow-api

jobs:
  # ===========================================
  # Deploy to Staging
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download CI binary
        uses: actions/download-artifact@v4
        with:
          name: api-binary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          ls -la ./artifact
          # Add your deployment logic here
          # Example: docker-compose up -d, kubectl apply -f k8s/staging/

      - name: Notify
        run: |
          echo "Deployed to staging"

  # ===========================================
  # Deploy to Production
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download CI binary
        uses: actions/download-artifact@v4
        with:
          name: api-binary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          ls -la ./artifact
          # Add your deployment logic here
          # Example: kubectl apply -f k8s/production/

      - name: Notify
        run: |
          echo "Deployed to production"

  # ===========================================
  # Docker Build & Push
  # ===========================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v2-')) }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=sha,prefix=${{ github.event.workflow_run.head_branch }}-
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
