name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'GHCR image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: 📝 Prepare deployment variables
        id: vars
        run: |
          echo "deploy_dir=/opt/genflow" >> $GITHUB_OUTPUT
          echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
          echo "env_file=.env.production" >> $GITHUB_OUTPUT

      - name: 🔑 Deploy via SSH (staging)
        if: ${{ inputs.environment == 'staging' }}
        uses: appleboy/ssh-action@cac19b8814ecea08f7e84ff838c9f166f2435715d # v1.2.0 pinned
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            echo "🚀 GenFlow CD — target: staging"
            echo "   Image tag: ${{ inputs.image_tag }}"
            cd ${{ steps.vars.outputs.deploy_dir }}
            export IMAGE_TAG=${{ inputs.image_tag }}
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 10
            curl -f http://localhost:3000/health || (docker compose logs --tail=20; exit 1)
            docker image prune -f --filter "until=24h"

      - name: 🔑 Deploy via SSH (production)
        if: ${{ inputs.environment == 'production' }}
        uses: appleboy/ssh-action@cac19b8814ecea08f7e84ff838c9f166f2435715d
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            echo "🚀 GenFlow CD — target: production"
            echo "   Image tag: ${{ inputs.image_tag }}"
            cd ${{ steps.vars.outputs.deploy_dir }}
            export IMAGE_TAG=${{ inputs.image_tag }}
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 10
            curl -f http://localhost:3000/health || (docker compose logs --tail=20; exit 1)
            docker image prune -f --filter "until=24h"

      - name: 📋 Deployment summary
        run: |
          echo "## ✅ Deployed ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "| Env | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
