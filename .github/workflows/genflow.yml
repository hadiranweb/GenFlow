# =============================================================================
# GenFlow v2 — CI Pipeline
#
# Fixed: actions/checkout@v4 replaces git clone, proper GHCR login with actor
# =============================================================================

name: CI

on:
  push:
    branches:
      - main-platform
      - v2-island-architecture
  pull_request:
    branches:
      - main-platform

permissions:
  contents: read
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Rust — format, clippy, unit tests
  # ============================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --component clippy,rustfmt --no-self-update
          rustup default 1.88
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --locked --exclude genflow-gateway
      - run: cargo check -p genflow-gateway --locked

  # ============================================================
  # Docker — Build & push API image to GHCR
  # ============================================================
  docker-api:
    name: Docker API
    needs: [rust]
    runs-on: ubuntu-latest
    # Allow push even if rust had warnings (but not if it failed entirely)
    if: always() && needs.rust.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate image tags
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.timestamp }}
        env:
          # In case GITHUB_TOKEN doesn't have write:packages, allow override via secret
          DOCKER_PAT: ${{ secrets.DOCKER_PAT || secrets.GITHUB_TOKEN }}

  # ============================================================
  # Docker — Build & push Web image to GHCR
  # ============================================================
  docker-web:
    name: Docker Web
    needs: [rust]
    runs-on: ubuntu-latest
    if: always() && needs.rust.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate image tags
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PAT || secrets.GITHUB_TOKEN }}
      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.timestamp }}
