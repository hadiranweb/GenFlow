name: CI

on: [push]

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Rust — format, clippy, unit tests
  # ============================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: rustup toolchain install 1.88 --component clippy,rustfmt
      - run: rustup default 1.88
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --locked --exclude genflow-gateway
      - run: cargo check -p genflow-gateway --locked

  # ============================================================
  # Docker — Build & push API image to GHCR
  # ============================================================
  docker-api:
    name: Docker API
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -f Dockerfile -t ghcr.io/${{ github.repository }}/api:latest .
      - run: docker push ghcr.io/${{ github.repository }}/api:latest

  # ============================================================
  # Docker — Build & push Web image to GHCR
  # ============================================================
  docker-web:
    name: Docker Web
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: corepack enable && corepack prepare pnpm@9.1.0 --activate
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -f apps/web/Dockerfile -t ghcr.io/${{ github.repository }}/web:latest .
      - run: docker push ghcr.io/${{ github.repository }}/web:latest
