name: CI

on: [push]

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------
  # Build & test Rust binary
  # -------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: rustup toolchain install stable --component clippy,rustfmt
      - run: rustup default stable
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy -p genflow-gateway
        continue-on-error: true

  # -------------------------------------------------------
  # Build & push API Docker image (ALWAYS runs)
  # -------------------------------------------------------
  docker-api:
    name: Docker API
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -f Dockerfile -t ghcr.io/${{ github.repository }}/api:latest .
      - run: docker push ghcr.io/${{ github.repository }}/api:latest

  # -------------------------------------------------------
  # Build & push Web Docker image (ALWAYS runs)
  # -------------------------------------------------------
  docker-web:
    name: Docker Web
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - run: corepack enable && corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - run: pnpm --filter @genflow/web build
        continue-on-error: true
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -f apps/web/Dockerfile -t ghcr.io/${{ github.repository }}/web:latest .
      - run: docker push ghcr.io/${{ github.repository }}/web:latest
