name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.1.0, 2.2.0-beta.1)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run — create tag + release but skip Docker push'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -P '^\d+\.\d+\.\d+' > /dev/null; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          TITLE_INPUT="${{ inputs.title }}"
          if [ -z "$TITLE_INPUT" ]; then
            echo "release_title=GenFlow v$VERSION" >> $GITHUB_OUTPUT
          else
            echo "release_title=$TITLE_INPUT" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Verify workspace compiles
        run: |
          rustup toolchain install 1.88 --component clippy,rustfmt --no-self-update
          rustup default 1.88
          cargo clippy --workspace --all-targets -- -A warnings
          cargo test --workspace --lib --exclude genflow-gateway || true

      - name: 🏷️ Create git tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.validate.outputs.tag }}" \
            -m "Release ${{ steps.validate.outputs.release_title }}"
          git push origin "${{ steps.validate.outputs.tag }}"

      - name: 📝 Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "${{ steps.validate.outputs.tag }}" | head -1 || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "notes=First official release." >> $GITHUB_OUTPUT
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREV_TAG" >> $GITHUB_OUTPUT
            git log "$PREV_TAG..${{ steps.validate.outputs.tag }}" --oneline --no-decorate 2>/dev/null | head -20 >> $GITHUB_OUTPUT || true
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@72f2c25fcb47643c292f710763431c56ea4d2dfb
        with:
          tag_name: ${{ steps.validate.outputs.tag }}
          name: ${{ steps.validate.outputs.release_title }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(inputs.version, 'beta') || contains(inputs.version, 'rc') || contains(inputs.version, 'dryrun') }}

      - name: 📋 Release summary
        run: |
          echo "## ✅ Released v${{ steps.validate.outputs.version }} (dry_run=${{ inputs.dry_run }})" >> $GITHUB_STEP_SUMMARY
