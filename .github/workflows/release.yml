name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.1.0, 2.2.0-beta.1)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run — create tag + release but skip Docker push'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -P '^\d+\.\d+\.\d+' > /dev/null; then
            echo "❌ Invalid version format: $VERSION"
            echo "   Expected format: 2.1.0"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          TITLE_INPUT="${{ inputs.title }}"
          if [ -z "$TITLE_INPUT" ]; then
            echo "release_title=GenFlow v$VERSION" >> $GITHUB_OUTPUT
          else
            echo "release_title=$TITLE_INPUT" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Verify workspace compiles
        run: |
          rustup toolchain install 1.88 --component clippy,rustfmt --no-self-update
          rustup default 1.88
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --lib --locked

      - name: 🏷️ Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.validate.outputs.tag }}" \
            -m "Release ${{ steps.validate.outputs.release_title }}"
          git push origin "${{ steps.validate.outputs.tag }}"

      - name: 📝 Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "${{ steps.validate.outputs.tag }}" | head -1 || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "notes=First official release." >> $GITHUB_OUTPUT
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREV_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log "$PREV_TAG..${{ steps.validate.outputs.tag }}" --oneline --no-decorate >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f710763431c56ea4d2dfb # v2.0.8 pinned
        with:
          tag_name: ${{ steps.validate.outputs.tag }}
          name: ${{ steps.validate.outputs.release_title }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(inputs.version, 'beta') || contains(inputs.version, 'rc') }}

      - name: 🔑 Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@354d375c3a068f7d6a137319f2bb83798b39b8c565 # v3.3.0 pinned
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@50123e1dd9b3e6e180f2119907f2e1e079a06b24 # v3.7.1 pinned

      - name: 🐳 Build and push API image (versioned)
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@8eb83df4495031c2d9bced34d06d4f968a7cabbde # v5.3.0 pinned
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.validate.outputs.version }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build and push Web image (versioned)
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@8eb83df4495031c2d9bced34d06d4f968a7cabbde
        with:
          context: ./apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.validate.outputs.version }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Release summary
        run: |
          echo "## ✅ Released v${{ steps.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.validate.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker API | \`ghcr.io/${{ github.repository }}/api:${{ steps.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Web | \`ghcr.io/${{ github.repository }}/web:${{ steps.validate.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
