name: GenFlow v2 CI/CD

on:
  push:
    branches: [main, develop, 'v2-*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/genflow-api

jobs:
  # ─── Cargo Check ───
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Cargo check (download deps first)
        run: cargo check --workspace 2>&1 | tee check-output.txt; true
      - name: Report check results
        run: |
          if grep -q "error" check-output.txt; then
            echo "::error::Cargo check found errors"
            exit 1
          fi
          echo "Cargo check passed"

  # ─── Cargo Test ───
  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genflow
          POSTGRES_PASSWORD: genflow
          POSTGRES_DB: genflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.78"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Run unit tests only (no DB required)
        run: cargo test --workspace --lib 2>&1 | tee test-output.txt; true
      - name: Report test results
        run: |
          if grep -q "FAILED" test-output.txt; then
            echo "::error::Some tests failed"
            exit 1
          fi
          echo "Tests passed"

  # ─── Build & Push Docker (only on main) ───
  build-and-push:
    name: Build & Push Docker Image
    needs: [check, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
