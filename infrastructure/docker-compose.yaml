version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────
  # Frontend: Next.js
  # ─────────────────────────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # Backend: Rust Axum
  # ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://genflow:genflow123@db:5432/genflow
      - REDIS_URL=redis://cache:6379
      - QDRANT_URL=http://vector:6333
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      vector:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
      - cargo-cache:/root/.cargo
    command: cargo watch -x run

  # ─────────────────────────────────────────────────────────────────
  # Database: PostgreSQL
  # ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=genflow
      - POSTGRES_PASSWORD=genflow123
      - POSTGRES_DB=genflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../apps/api/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genflow -d genflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Cache: Redis
  # ─────────────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Vector DB: Qdrant
  # ─────────────────────────────────────────────────────────────────
  vector:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  cargo-cache:
