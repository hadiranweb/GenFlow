# راه‌اندازی ساده روی یک VPS:
#   ۱) cp .env.example .env   و مقادیر را پر کنید
#   ۲) docker compose up -d --build
#   ۳) docker compose logs -f
services:
  node-eval-bot:
    build: .
    image: node-eval-bot:latest
    container_name: node-eval-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      # دادهٔ کاربران و گزارش‌های ساخته‌شده روی هاست می‌ماند (پشتیبان‌گیری ساده)
      - ./data:/app/data
    ports:
      - '${HTTP_PORT:-8080}:${HTTP_PORT:-8080}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
