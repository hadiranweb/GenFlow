# ---------------------------------------------------------------------------
# کتابخانهٔ اقدام — برای تولید «مسیر پیشنهادی» در تفسیر داخلی و
# به‌عنوان راهنمای دامنه در پرامپت مفسر عمیق.
# کلیدها با code محورهای ماتریس عارضه‌یابی یکی است (۹ محور).
# ---------------------------------------------------------------------------
domains:
  strategy:
    title: استراتژی و مدل کسب‌وکار
    owner_role: رهبر کسب‌وکار
    summary: مدل درآمدی روشن، بازار هدف مستند و اهداف شکسته‌شده به گام‌های دوره‌ای.
    actions:
      - title: نوشتن مدل درآمدی در یک صفحه
        why: بدون مدل درآمدی روشن، هر تصمیم اجرایی روی حدس بنا می‌شود.
        horizon: کوتاه‌مدت
      - title: شکستن اهداف ۱۲ماهه به اهداف فصلی و ماهانه
        why: هدف کلانِ نشکسته، در عمل پیگیری نمی‌شود.
        horizon: کوتاه‌مدت
      - title: مستندسازی برآورد بازار هدف و مزیت رقابتی
        why: مزیت دفاع‌ناپذیر، در اولین فشار بازار از بین می‌رود.
        horizon: میان‌مدت

  process:
    title: فرآیندها و رویه‌ها
    owner_role: مدیر عملیات
    summary: فرآیند مستند، مالک مشخص و گلوگاه‌های اندازه‌گیری‌شده.
    actions:
      - title: ترسیم نقشهٔ فرآیندهای اصلی (Workflow Map)
        why: فرآیند ترسیم‌نشده، به فرد وابسته می‌شود و تکرارپذیر نیست.
        horizon: کوتاه‌مدت
      - title: تعیین مالک و زمان چرخهٔ هر فرآیند
        why: فرآیند بدون مالک، گلوگاه پنهان می‌سازد.
        horizon: کوتاه‌مدت
      - title: تعریف رویهٔ اضطراری برای دو اختلال محتمل
        why: نبود رویهٔ جایگزین، یک خطای کوچک را به توقف کامل تبدیل می‌کند.
        horizon: میان‌مدت

  data:
    title: داده و مدل داده
    owner_role: تحلیلگر داده
    summary: ساختار داده تعریف‌شده، دسترسی مدیریت‌شده و گزارش‌های مستقیم از داده.
    actions:
      - title: تعریف ساختار داده‌های اصلی (Data Model)
        why: دادهٔ بدون ساختار، گزارش قابل اتکا تولید نمی‌کند.
        horizon: میان‌مدت
      - title: تعیین سطوح دسترسی و محرمانگی داده
        why: دسترسی بی‌قاعدهٔ داده، ریسک حقوقی و اعتباری می‌سازد.
        horizon: کوتاه‌مدت
      - title: حذف گزارش‌سازی دستی با اتصال مستقیم به داده
        why: گزارش دستی، زمان و خطای انسانی مصرف می‌کند.
        horizon: میان‌مدت

  tech:
    title: فناوری و اتوماسیون
    owner_role: مسئول فناوری
    summary: ابزار متناسب، اتوماسیون پایدار و نگهداشت مشخص.
    actions:
      - title: پایداری‌سنجی اتوماسیون‌های موجود و رفع خطای مکرر
        why: اتوماسیون ناپایدار، اتکای تیم به آن را از بین می‌برد.
        horizon: کوتاه‌مدت
      - title: یکپارچه‌سازی دو سامانهٔ اصلی (API/فایل مشترک)
        why: ورود دوبارهٔ داده، منبع همیشگی خطاست.
        horizon: میان‌مدت
      - title: پشتیبان‌گیری خودکار و آزمون واقعی بازیابی
        why: پشتیبانی که بازیابی‌اش آزموده نشده، پشتیبان نیست.
        horizon: کوتاه‌مدت

  standard:
    title: استانداردها و انطباق
    owner_role: ناظر انطباق
    summary: الزامات به‌روز، مجوزهای معتبر و سوابق ممیزی.
    actions:
      - title: فهرست به‌روز استانداردها و الزامات مرتبط
        why: الزام ناشناخته، ریسک جریمه و توقف فعالیت است.
        horizon: کوتاه‌مدت
      - title: بررسی اعتبار مجوزها و گواهی‌نامه‌ها
        why: مجوز منقضی می‌تواند کل فعالیت را متوقف کند.
        horizon: کوتاه‌مدت
      - title: نگهداری سوابق ممیزی و اقدامات اصلاحی
        why: سابقهٔ نانوشته، در بازرسی قابل دفاع نیست.
        horizon: میان‌مدت

  people:
    title: سرمایه انسانی و آموزش
    owner_role: مدیر منابع انسانی
    summary: نقش روشن، آموزش منظم و کاهش وابستگی به فرد کلیدی.
    actions:
      - title: به‌روزرسانی شرح وظایف و ساختار سازمانی
        why: ابهام نقش، تعارض و دوباره‌کاری می‌سازد.
        horizon: کوتاه‌مدت
      - title: مستندسازی دانش فرد کلیدی و آموزش جانشین
        why: نقطهٔ شکست تک‌نفره، بزرگ‌ترین ریسک تداوم است.
        horizon: میان‌مدت
      - title: جلسهٔ بازخورد عملکرد با ساختار ثابت
        why: بازخورد بی‌ساختار یا انجام نمی‌شود یا به تعارض می‌رسد.
        horizon: کوتاه‌مدت

  market:
    title: بازاریابی، فروش و برند
    owner_role: مدیر بازاریابی و فروش
    summary: پرسونای مستند، کانال‌های اندازه‌گیری‌شده و هویت برند یکدست.
    actions:
      - title: مستندسازی پرسونای مشتری و نیاز او
        why: پیام بدون پرسونا، بودجهٔ بازاریابی را هدر می‌دهد.
        horizon: کوتاه‌مدت
      - title: اندازه‌گیری بازده کانال‌های جذب
        why: کانال بی‌اندازه‌گیری، هزینهٔ پنهان است.
        horizon: کوتاه‌مدت
      - title: تعریف و پایش قیف فروش (سرنخ تا خرید)
        why: بدون قیف، نقطهٔ افت فروش دیده نمی‌شود.
        horizon: میان‌مدت

  finance:
    title: مالی و بهره‌وری
    owner_role: مدیر مالی / مالک کسب‌وکار
    summary: صورت مالی ماهانه، بهای تمام‌شدهٔ به‌روز و کنترل هدررفت.
    actions:
      - title: تهیهٔ صورت درآمد و هزینهٔ ماهانه
        why: بدون تصویر مالی ماهانه، هر تصمیم روی حدس بنا می‌شود.
        horizon: کوتاه‌مدت
      - title: محاسبهٔ بهای تمام‌شده و حاشیهٔ سود هر محصول/خدمت
        why: میانگین‌ها، محصول زیان‌ده را پنهان می‌کنند.
        horizon: میان‌مدت
      - title: ممیزی هزینه‌های پنهان و هدف کاهش
        why: بیشترین سود سریع، معمولاً از هزینه‌های بی‌اثر برمی‌گردد.
        horizon: کوتاه‌مدت

  risk:
    title: ریسک، کیفیت و پایداری
    owner_role: رهبر کسب‌وکار
    summary: ریسک‌های فهرست‌شده، برنامهٔ کاهش و نگهداشت پیشگیرانه.
    actions:
      - title: تهیهٔ فهرست ریسک‌های اصلی (عملیاتی/مالی/حقوقی)
        why: ریسک نانوشته، بحران غافلگیرکننده می‌سازد.
        horizon: کوتاه‌مدت
      - title: نوشتن برنامهٔ کاهش برای دو ریسک بحرانی
        why: شناخت ریسک بدون اقدام، فقط نگرانی تولید می‌کند.
        horizon: میان‌مدت
      - title: ثبت و ریشه‌یابی حوادث و خطاها
        why: خطای ریشه‌یابی‌نشده، تکرار می‌شود.
        horizon: میان‌مدت

severity_priority:
  critical: "اقدام فوری (کوتاه‌مدت)"
  warning: "پیگیری نزدیک (میان‌مدت)"
  acceptable: "بهبود تدریجی"
  healthy: "حفظ و تثبیت وضعیت"
