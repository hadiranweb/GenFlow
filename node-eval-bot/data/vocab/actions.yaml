# ---------------------------------------------------------------------------
# کتابخانهٔ اقدام — از «ماتریس تفسیر پنج‌لایه» ساخته شده است.
# کلیدها با code لایه‌های عارضه‌یابی (۵ لایه) یکی است؛ عنوان و ترتیب اقدام‌ها
# عین «راهکارهای پیشنهادی» سند است و به درخت کلیدواژهٔ همان لایه در
# data/vocab/interpretation-matrix.yaml وصل‌اند (فیلد keyword_ref).
# ---------------------------------------------------------------------------
domains:
  governance:
    title: حاکمیت
    owner_role: مالک / رهبر کسب‌وکار
    summary: جداسازی نقش مالک از اپراتور، شفافیت استراتژی و اهداف فصلی مکتوب.
    actions:
      - title: تدوین هدف استراتژیک ۱ صفحه‌ای
        why: بنیان‌گذار درگیر اجراست و اهداف کلان مکتوب نیست (تلهٔ متخصص).
        horizon: کوتاه‌مدت
        keyword_ref: L1-K1
      - title: اصلاح برداشت‌های مالی
        why: برداشت شخصیِ مخلوط با شرکت، سود واقعی و نقدینگی عملیاتی را نامرئی می‌کند.
        horizon: کوتاه‌مدت
        keyword_ref: L1-K2
      - title: آزادسازی زمان مالک برای نقش طراحی
        why: تا زمان مالک در اجرا قفل باشد، هیچ لایهٔ دیگری پایدار نمی‌شود.
        horizon: میان‌مدت
        keyword_ref: L1-K3

  architecture:
    title: معماری و طراحی
    owner_role: مدیر عملیات
    summary: فرایندهای استاندارد مکتوب در مسیر حیاتی مشتری و چک‌لیست‌های تحویل.
    actions:
      - title: نقشه‌برداری زنجیره ارزش مشتری
        why: وابستگی به دانش ذهنی افراد، خطای تکراری و آموزش پرهزینه می‌سازد.
        horizon: کوتاه‌مدت
        keyword_ref: L2-K1
      - title: استخراج ۵ فرآیند کلیدی با مصاحبه از مجریان
        why: دانش ضمنیِ مجریان اگر استخراج نشود، با خروج هر فرد از شرکت خارج می‌شود.
        horizon: کوتاه‌مدت
        keyword_ref: L2-K2
      - title: تدوین چک‌لیست‌های تحویل کار
        why: نبود SOPهای ۱-۲-۳ یعنی کیفیت هر خروجی به حافظه و دقت لحظه‌ای افراد گره خورده است.
        horizon: میان‌مدت
        keyword_ref: L2-K3

  implementation:
    title: جاری‌سازی
    owner_role: مدیر اجرایی / رهبر تیم
    summary: تیم خودمختار با تفویض «نتیجهٔ نهایی» به جای تکلیف روزمره.
    actions:
      - title: تعیین اختیارات تصمیم‌گیری مالی و عملیاتی پرسنل
        why: تلهٔ تصمیم‌گیری و تفویض معکوس، مدیر را به گلوگاه همهٔ کارها تبدیل کرده است.
        horizon: کوتاه‌مدت
        keyword_ref: L3-K1
      - title: آموزش مبتنی بر سناریو
        why: دستورالعملِ خوانده‌شده بدون تمرین سناریو، در موقعیت واقعی به رفتار تبدیل نمی‌شود.
        horizon: میان‌مدت
        keyword_ref: L3-K2
      - title: ارزیابی آزمون مرخصی کوتاه‌مدت
        why: وابستگی واقعی به مدیر فقط با آزمون غیبت دیده می‌شود، نه با حدس.
        horizon: میان‌مدت
        keyword_ref: L3-K3

  maintenance:
    title: نگهداشت و پایش
    owner_role: مدیر عملیات / مالک شاخص‌ها
    summary: داشبورد KPI هفتگی، جلسات ثابت حل مسئله و اصلاح مستمر باگ‌های فرایندی.
    actions:
      - title: استقرار داشبورد عددی هفتگی
        why: مدیریت با حس ششم و موجودی حساب، انحراف را وقتی می‌بیند که به بحران تبدیل شده است.
        horizon: کوتاه‌مدت
        keyword_ref: L4-K1
      - title: ریتم جلسات منضبط هفتگی
        why: جلسهٔ هنگام بحران یعنی مسئله همیشه چند هفته از سیستم جلوتر است.
        horizon: کوتاه‌مدت
        keyword_ref: L4-K2
      - title: ایجاد رویه ثبت و بازبینی باگ‌های فرآیندی
        why: خطایی که ثبت و ریشه‌یابی نشود، با هزینهٔ بیشتر برمی‌گردد.
        horizon: میان‌مدت
        keyword_ref: L4-K3

  scaling:
    title: توسعه و مقیاس‌پذیری
    owner_role: مالک / رهبر کسب‌وکار
    summary: قابلیت تکثیر آسان؛ آمادگی شعبه، برون‌سپاری یا نمایندگی.
    actions:
      - title: استانداردسازی پکیج عملیاتی
        why: تکثیرِ مدلِ استانداردنشده، بحران فعلی را در چند نقطه بازتولید می‌کند.
        horizon: میان‌مدت
        keyword_ref: L5-K1
      - title: شناسایی خدمات مقیاس‌پذیر
        why: سقف رشد وقتی به زمان فیزیکی مالک گره خورده، با استخدام خطی باز نمی‌شود.
        horizon: میان‌مدت
        keyword_ref: L5-K2
      - title: ایجاد ظرفیت زیرسیستم‌های جدید
        why: رشد بدون ظرفیت زیرسیستم (نیرو، تأمین، فناوری، کنترل کیفیت) کیفیت را قربانی می‌کند.
        horizon: بلندمدت
        keyword_ref: L5-K3

severity_priority:
  critical: "اقدام فوری (کوتاه‌مدت)"
  warning: "پیگیری نزدیک (میان‌مدت)"
  acceptable: "بهبود تدریجی"
  healthy: "حفظ و تثبیت وضعیت"
