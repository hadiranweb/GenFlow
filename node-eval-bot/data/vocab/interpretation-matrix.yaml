# ---------------------------------------------------------------------------
# «ماتریس تفسیر عارضه‌یابی پنج‌لایه» — منبع حقیقت تفسیر
#
# منبع: سند «عارضه‌یابی پنج‌لایه» (بخش ۲: گزارش ماتریسی شکاف + بخش ۳:
#       نظام امتیازدهی و رادار بلوغ سیستم‌سازی) — متن کامل سند:
#       docs/reference/five-layer-source.md
#
# مصرف‌کننده‌ها:
#   ۱) مفسر داخلی رنجی (deterministic): برای هر لایهٔ ضعیف، «وضع موجود»
#      معنا، سیگنال و اقدام از همین جدول خوانده می‌شود؛ عدد جدید ساخته نمی‌شود.
#   ۲) مفسر عمیق AI: این ماتریس (فشرده) در پرامپت می‌رود تا مدل دقیقاً روی
#      زبان همین سند تفسیر کند، نه دانش عمومی خودش.
#   ۳) سند HTML: جدول «گزارش ماتریسی شکاف» (لایه | وضع موجود | وضع مطلوب |
#      راهکار) از همین فایل ساخته می‌شود.
#
# قرارداد امتیاز: هر لایه ۰..۲۰ (میانگین نرمال‌شده × ۲۰)، مجموع ۱۰۰.
# نوارهای تفسیری لایه روی مقیاس ۰..۱۰۰ با severity_bands در
# data/scoring/matrix.yaml یکی است: ≥۷۵ مطلوب · ۶۰..۷۵ مرزی ·
# ۴۰..۶۰ نیازمند اصلاح · <۴۰ بحرانی (معادل ۰..۲۰: ≥۱۵ · ۱۲..۱۵ · ۸..۱۲ · <۸).
# ---------------------------------------------------------------------------
version: five-layer-interpretation-1.2.0
source_document: "عارضه‌یابی پنج لایه - نسخه ۰ تا ۱۰ (طبق پلی‌بوک) — نوت واحد عارضه‌یابی مدل سیستم‌سازی کسب‌وکارهای کوچک (مدل پنج‌لایه)، version 0.1-draft"

scoring:
  per_layer_max: 20
  total_max: 100
  layer_score_formula: "mean(normalized answers of layer) * 20"
  total_formula: "sum of layer scores (equal weights)"
  bottleneck_rule: "کم‌امتیازترین لایه = گلوگاه بحرانی فعلی کسب‌وکار"
  # نوارهای موقت (provisional) خود سند — نسخهٔ ۰ تا ۱۰
  # مرزها پیوسته و نیم‌بازند [min, max) — نسخهٔ نهایی سند؛ نیم‌امتیاز بدون طبقه نمی‌ماند
  layer_bands_provisional:
    - { key: weak, label: "ضعف (گلوگاه بالقوه)", min: 0, max: 10, max_inclusive: false, meaning: "لایه عملاً برقرار نیست و به‌احتمال زیاد گلوگاه فعلی کل سیستم است." }
    - { key: growing, label: "در حال رشد", min: 10, max: 15, max_inclusive: false, meaning: "اسکلت لایه وجود دارد اما ناپایدار است؛ با اقدام‌های مشخص قابل تثبیت است." }
    - { key: strong, label: "قوی", min: 15, max: 20, max_inclusive: true, meaning: "لایه برقرار است؛ تمرکز بر تثبیت و انتقال الگو به لایه‌های ضعیف‌تر." }
  maturity_bands_provisional:
    - { key: nascent, label: نوپا, min: 0, max: 40, max_inclusive: false }
    - { key: forming, label: "در حال شکل‌گیری", min: 40, max: 60, max_inclusive: false }
    - { key: maturing, label: "در حال بلوغ", min: 60, max: 80, max_inclusive: false }
    - { key: mature, label: بالغ, min: 80, max: 100, max_inclusive: true }
  gap_inclusion_rule: "همهٔ ۵ لایه بدون توجه به نمره در گزارش شکاف می‌آیند؛ نمره فقط برای اولویت‌بندی و گلوگاه است."
  reverse_items: [L1-Q2, L2-Q3, L3-Q2, L4-Q3, L5-Q3]

# بخش عمومی فرم (در سند: «بخش اطلاعات پایه و نبض کسب‌وکار») — هنوز در جریان
# ربات نیست (نیازمند ورودی انتخابی/متنی)؛ اینجا ثبت شده تا از منبع جا نماند.
general_section:
  title: بخش اطلاعات پایه و نبض کسب‌وکار (زمینه‌ای؛ بدون نمره)
  scored: false
  in_bot_flow: false
  fields:
    - { label: "حوزه فعالیت و مدل درآمدی", type: single_choice, options: [B2C, B2B, خدماتی, تولیدی, بازرگانی] }
    - { label: "تعداد پرسنل (تمام‌وقت و پاره‌وقت) و سابقه کسب‌وکار", type: number_pair, fields: [headcount, business_age_years] }
    - { label: "ساعات کار هفتگی شخص مدیر", type: number, field: manager_weekly_hours }

layers:
  governance:
    construct: میزان جداسازی نقش مالک از اجرا و وجود استراتژی مکتوب و تسهیم‌شده
    title: حاکمیت
    title_en: Governance
    objective: "سنجش میزان شفافیت چشم‌انداز، تفکیک نقش مالک از مجری، و تخصیص منابع."
    as_is: "تله متخصص؛ بنیان‌گذار درگیر کارهای اجرایی است و اهداف کلان مکتوب نیست."
    to_be: "جداسازی نقش مالک از اپراتور؛ شفافیت استراتژی و تعیین سهم اهداف فصلی."
    recommended_actions: "تدوین هدف استراتژیک ۱ صفحه‌ای، اصلاح برداشت‌های مالی، آزادسازی زمان مالک برای نقش طراحی."
    keyword_tree:
      - id: L1-K1
        title: تدوین هدف استراتژیک ۱ صفحه‌ای
        child_keywords: [چشم‌انداز و رسالت, اولویت‌ها و انتخاب‌های راهبردی, اهداف سالانه و فصلی, معیارهای موفقیت و نتایج کلیدی, تسهیم و هم‌سویی اهداف با مدیران و شرکا]
        related_question_refs: [L1-Q3]
        supporting_source_ids: [ifc_sme_governance, sme_governance_strategic_change]
      - id: L1-K2
        title: اصلاح برداشت‌های مالی
        child_keywords: [تفکیک حساب‌های شخصی و کسب‌وکار, حقوق، برداشت و توزیع سود مالک, هزینه‌های مرتبط با مالک و نرمال‌سازی سود, سودآوری عملیاتی در برابر موجودی نقد, جریان نقدی و سرمایه در گردش]
        related_question_refs: [L1-Q4]
        supporting_source_ids: [ifc_sme_governance]
      - id: L1-K3
        title: آزادسازی زمان مالک برای نقش طراحی
        child_keywords: [ممیزی زمان مالک, تفکیک نقش مالک، مدیر و اپراتور, کاهش وابستگی عملیاتی به مالک, واگذاری فعالیت‌های روزمره, تداوم کسب‌وکار در غیاب مالک]
        related_question_refs: [L1-Q1, L1-Q2]
        supporting_source_ids: [ifc_sme_governance, small_business_growth_managers]

  architecture:
    construct: میزان مکتوب بودن فرایندهای حیاتی، پوشش SOP و وضوح مسئولیت‌ها
    title: معماری و طراحی
    title_en: Architecture
    objective: "بررسی شفافیت جریان کارها، دستورالعمل‌ها (SOP) و چک‌لیست‌ها."
    as_is: "وابستگی به دانش ذهنی افراد؛ خطاهای تکراری به دلیل نبود SOPهای ۱-۲-۳."
    to_be: "فرآیندهای استاندارد مکتوب در مسیر حیاتی مشتری (Critical Flow) و چک‌لیست‌ها."
    recommended_actions: "نقشه‌برداری زنجیره ارزش مشتری، استخراج ۵ فرآیند کلیدی با مصاحبه از مجریان، تدوین چک‌لیست‌های تحویل کار."
    keyword_tree:
      - id: L2-K1
        title: نقشه‌برداری زنجیره ارزش مشتری
        child_keywords: [نقشه سفر مشتری, جریان انتهابه‌انتهای جذب تا تحویل, نقاط تماس و تحویل بین‌نقشی, ورودی‌ها، خروجی‌ها و ارزش مشتری, گلوگاه‌ها، انتظار و دوباره‌کاری]
        related_question_refs: [L2-Q1]
        supporting_source_ids: [bpm_lifecycle_case, bpm_process_discovery]
      - id: L2-K2
        title: استخراج ۵ فرآیند کلیدی با مصاحبه از مجریان
        child_keywords: [اولویت‌بندی فرآیندهای حیاتی, مصاحبه و مشاهده مجریان, استخراج دانش ضمنی, مرزبندی فرآیند با SIPOC, مدل‌سازی وضعیت موجود (As-Is)]
        related_question_refs: [L2-Q1, L2-Q2, L2-Q3]
        supporting_source_ids: [bpm_lifecycle_case, bpm_process_discovery]
      - id: L2-K3
        title: تدوین چک‌لیست‌های تحویل کار
        child_keywords: [SOPهای گام‌به‌گام, چک‌لیست تحویل و کنترل کیفیت, معیار پذیرش و تعریف خروجی کامل, مالک فرایند و مسئولیت‌ها (RACI), نسخه‌بندی و بازنگری اسناد]
        related_question_refs: [L2-Q2, L2-Q3, L2-Q4]
        supporting_source_ids: [sop_practitioner, ifa_four_pillars]

  implementation:
    construct: میزان استقلال تیم در اجرای فرایندها و پایبندی به دستورالعمل‌ها در غیاب مالک
    title: جاری‌سازی
    title_en: Implementation
    objective: "بررسی توانایی پرسنل در اجرای خودکار فرآیندها بدون نیاز به پیگیری مداوم مدیر."
    as_is: "تله تصمیم‌گیری؛ پرسنل منتظر تأیید مدیر هستند و تفویض معکوس رخ می‌دهد."
    to_be: "تیم خودمختار؛ تفویض مسئولیت «نتیجه نهایی» (Outcome) به جای تکلیف روزمره."
    recommended_actions: "تعیین اختیارات تصمیم‌گیری مالی و عملیاتی پرسنل، آموزش مبتنی بر سناریو، ارزیابی آزمون مرخصی کوتاه‌مدت."
    keyword_tree:
      - id: L3-K1
        title: تعیین اختیارات تصمیم‌گیری مالی و عملیاتی پرسنل
        child_keywords: [حدود اختیار تصمیم‌گیری, آستانه‌های مالی و عملیاتی, نقش تصمیم‌گیر، مجری و پاسخ‌گو, مالکیت نتیجه (Outcome Ownership), قواعد ارجاع و مدیریت استثنا]
        related_question_refs: [L3-Q1, L3-Q2, L3-Q3, L3-Q4]
        supporting_source_ids: [ifc_sme_governance, employee_autonomy_plos, delegation_feedback_pmc]
      - id: L3-K2
        title: آموزش مبتنی بر سناریو
        child_keywords: [سناریوهای پرتکرار شغلی, سناریوهای استثنایی و بحرانی, تمرین و شبیه‌سازی تصمیم, آموزش نقش‌محور و ورود کارکنان, سنجش شایستگی و بازخورد]
        related_question_refs: [L3-Q2, L3-Q3, L3-Q4]
        supporting_source_ids: [change_adoption_wiley, manager_autonomy_training, prosci_adkar]
      - id: L3-K3
        title: ارزیابی آزمون مرخصی کوتاه‌مدت
        child_keywords: [آزمون غیبت مدیر یا مالک, تداوم خدمت و عملیات, نقاط وابستگی به مدیر, پوشش جانشین و انتقال اختیار, اقدام اصلاحی پس از آزمون]
        related_question_refs: [L3-Q1]
        supporting_source_ids: [ifc_sme_governance, small_business_growth_managers]

  maintenance:
    construct: میزان پایش عددی عملکرد، انضباط جلسات، و یادگیری سازمانی از خطاها
    title: نگهداشت و پایش
    title_en: Maintenance
    objective: "سنجش مستمر خروجی‌ها در برابر اهداف، پایش KPIها و مکانیزم‌های بازخورد."
    as_is: "مدیریت بر مبنای بحران و حساب بانکی؛ جلسات نامنظم هنگام آتش‌سوزی کاری."
    to_be: "داشبورد شاخص‌های کلیدی (KPI)، جلسات هفتگی ثابت حل مسئله، اصلاح مستمر باگ‌ها."
    recommended_actions: "استقرار داشبورد عددی هفتگی، ریتم جلسات منضبط هفتگی، ایجاد رویه ثبت و بازبینی باگ‌های فرآیندی."
    keyword_tree:
      - id: L4-K1
        title: استقرار داشبورد عددی هفتگی
        child_keywords: [شاخص‌های کلیدی عملکرد (KPI), تعریف هدف و آستانه هشدار, منبع داده و کیفیت داده, روند، مقایسه و انحراف, تناوب گزارش و مالک شاخص]
        related_question_refs: [L4-Q1, L4-Q4]
        supporting_source_ids: [pdca4_mdpi, pdca_bmj_systematic_review, asq_pdca]
      - id: L4-K2
        title: ریتم جلسات منضبط هفتگی
        child_keywords: [دستورجلسه و ریتم ثابت, مرور عملکرد و انحراف‌ها, تصمیم‌گیری و حل مسئله, مالک اقدام و موعد پیگیری, ثبت تصمیم و بازبینی تعهدات]
        related_question_refs: [L4-Q2]
        supporting_source_ids: [pdca4_mdpi, asq_pdca]
      - id: L4-K3
        title: ایجاد رویه ثبت و بازبینی باگ‌های فرآیندی
        child_keywords: [ثبت خطا و عدم انطباق, تحلیل علت ریشه‌ای (RCA), اقدام اصلاحی و پیشگیرانه (CAPA), به‌روزرسانی مستندات و SOP, تأیید اثربخشی و پایش تکرار]
        related_question_refs: [L4-Q3, L4-Q4]
        supporting_source_ids: [rca_review, asq_problem_solving, pdca4_mdpi]

  scaling:
    construct: توان مقیاس‌پذیری عملیات، قابلیت تکثیر مدل بدون مالک، و اقتصاد واحد
    title: توسعه و مقیاس‌پذیری
    title_en: Scaling
    objective: "ارزیابی آمادگی کسب‌وکار برای تکثیر سیستم، فرانچایز، راه‌اندازی شعب یا تنوع درآمدی."
    as_is: "سقف رشد مسدود به زمان فیزیکی مالک؛ ناتوانی در پذیرش سفارش‌های بزرگ‌تر."
    to_be: "قابلیت تکثیر آسان؛ آمادگی برای ایجاد شعب، برون‌سپاری یا نمایندگی."
    recommended_actions: "استانداردسازی پکیج عملیاتی، شناسایی خدمات مقیاس‌پذیر، ایجاد ظرفیت زیرسیستم‌های جدید."
    keyword_tree:
      - id: L5-K1
        title: استانداردسازی پکیج عملیاتی
        child_keywords: [فرآیندهای هسته و استاندارد عملیاتی, کتابچه عملیات و SOPهای قابل تکثیر, آموزش و انتقال دانش به شعب, استاندارد تجربه برند و کیفیت, پایش انطباق و پشتیبانی شعب]
        related_question_refs: [L5-Q2]
        supporting_source_ids: [international_franchising_review, ifa_four_pillars, ifa_operations_manual]
      - id: L5-K2
        title: شناسایی خدمات مقیاس‌پذیر
        child_keywords: [تکرارپذیری مدل خدمت, تقاضا و تناسب بخش بازار, اقتصاد واحد و حاشیه مشارکت, هزینه نهایی تحویل خدمت, پتانسیل دیجیتالی‌سازی و خودکارسازی]
        related_question_refs: [L5-Q1, L5-Q2, L5-Q3]
        supporting_source_ids: [scaling_jms_2023, transition_startups_scaleups, scaling_digital_firms]
      - id: L5-K3
        title: ایجاد ظرفیت زیرسیستم‌های جدید
        child_keywords: [ظرفیت‌سنجی نیروی انسانی و تجهیزات, طراحی ماژولار زیرسیستم‌ها, زنجیره تأمین و شرکای اجرا, زیرساخت فناوری و داده, ظرفیت کنترل کیفیت و نظارت]
        related_question_refs: [L5-Q1, L5-Q3]
        supporting_source_ids: [scaling_jms_2023, transition_startups_scaleups, scaling_digital_firms]

# الگوهای بین‌لایه‌ای: ترکیب امتیاز دو لایه، معنایی دارد که هیچ‌کدام به‌تنهایی
# ندارند. مثال خود سند: «لایه ۲ قوی اما لایه ۳ ضعیف؛ یعنی فرآیندها نوشته شده
# اما اجرا نمی‌شوند.» آستانهٔ «قوی» ≥ ۶۰ و «ضعیف» < ۶۰ (مقیاس ۰..۱۰۰).
cross_layer_patterns:
  - id: written_not_executed
    when: { strong: architecture, weak: implementation }
    meaning: "فرآیندها نوشته شده‌اند اما اجرا نمی‌شوند؛ مسئله از جنس جاری‌سازی و فرهنگ سیستم‌پذیری است، نه مستندسازی بیشتر."
    action_focus: "به‌جای سند تازه، روی حدود اختیار، آموزش سناریومحور و آزمون غیبت کار کنید (درخت L3)."
  - id: owner_trap
    when: { weak: governance, also_weak: implementation }
    meaning: "تلهٔ مالک/متخصص: هم نقش مالک از مجری جدا نشده و هم تیم بدون تأیید مدیر حرکت نمی‌کند؛ دو لایه یک ریشه دارند."
    action_focus: "از آزادسازی زمان مالک و ممیزی نقش‌ها شروع کنید (L1-K3) و هم‌زمان حدود اختیار تیم را مکتوب کنید (L3-K1)."
  - id: undocumented_execution
    when: { strong: implementation, weak: architecture }
    meaning: "تیم فعلاً با تجربهٔ افراد کار را پیش می‌برد اما دانش در ذهن‌هاست؛ با رشد یا خروج افراد، کیفیت فرو می‌ریزد."
    action_focus: "استخراج دانش ضمنی و تدوین SOP برای ۵ فرایند کلیدی (L2-K2) پیش از هر برنامهٔ رشد."
  - id: blind_management
    when: { weak: maintenance }
    meaning: "مدیریت بر مبنای بحران و شهود؛ انحراف‌ها دیر دیده می‌شوند و هر اصلاحی بدون پایش، پایدار نمی‌ماند."
    action_focus: "داشبورد هفتگی KPI و ریتم جلسهٔ ثابت (L4-K1 و L4-K2) پیش‌شرط قابل اتکا شدن بقیهٔ اصلاح‌هاست."
  - id: premature_scaling
    when: { strong: scaling, weak_any: [governance, architecture, implementation] }
    meaning: "میل یا آمادگی رشد از بلوغ لایه‌های پایه جلو زده است؛ مقیاس‌گرفتن روی پایهٔ سست، بحران را بزرگ می‌کند نه کسب‌وکار را."
    action_focus: "اول گلوگاه لایهٔ پایه را ببندید؛ بعد سراغ پکیج عملیاتی و تکثیر بروید (L5-K1)."

# منابع پشتوانهٔ درخت کلیدواژه (از سند؛ برای ردیابی، بدون نقل‌قول مستقیم)
