# ---------------------------------------------------------------------------
# سیاست محاسبهٔ «عارضه‌یابی پنج‌لایه» (مرحلهٔ ۲) — نسخهٔ ۰ تا ۱۰ سند
# منبع: سند «عارضه‌یابی پنج لایه - نسخه ۰ تا ۱۰ (طبق پلی‌بوک)»، بخش ۳:
#   هر پاسخ ۰ تا ۱۰ · سؤال معکوس: نمره = ۱۰ − پاسخ
#   نمرهٔ لایه = مجموع ۴ نمرهٔ تعدیل‌شده ÷ ۲ (بازه ۰..۲۰)
#   نمرهٔ کل = مجموع ۵ لایه (۰..۱۰۰) · گلوگاه = کم‌امتیازترین لایه
#   (در تساوی: لایهٔ بالادستی‌تر/شمارهٔ کمتر)
# نوارهای لایه و بلوغ «موقت» (provisional) خود سند‌اند؛ وضعیت سند:
# 0.1-draft و نیازمند پایلوت (draft_pilot_required).
# ---------------------------------------------------------------------------
version: matrix-score-2.2.0

# امتیاز مطلوب هر لایه/کل (مبنای محاسبهٔ شکاف) — معادل ۱۵ از ۲۰ در هر لایه
target_index: 75

# نمرهٔ تعدیل‌شدهٔ ≤ این مقدار روی هر گزاره (۰..۱۰) = «عارضهٔ مشاهده‌شده»
symptom_threshold: 4

# دسته‌بندی داخلی هر لایه و کل بر پایهٔ شاخص ۰..۱۰۰ (برای اولویت‌بندی و رنگ)
severity_bands:
  healthy: 75       # ≥ 75 → مطلوب (≥۱۵ از ۲۰ · «قوی» در نوار موقت سند)
  borderline: 60    # 60..75 → مرزی
  needs_fix: 40     # 40..60 → نیازمند اصلاح
  # کمتر از 40 → بحرانی

# قرارداد سند پنج‌لایه (برای گزارش، رادار بلوغ و رتبهٔ بلوغ)
five_layer:
  per_layer_max: 20
  total_max: 100
  bottleneck_rule: lowest_layer_tie_upstream
  # نوارهای موقت لایه روی مقیاس ۰..۲۰ (عین سند نهایی) — مرزها پیوسته و
  # نیم‌بازند [min, max) تا نیم‌امتیازها (گام ۰٫۵ نمرهٔ لایه) بدون طبقه نمانند؛
  # فقط آخرین نوار سرِ بالا را شامل می‌شود و نیازی به گردکردن نیست.
  layer_bands_provisional:
    - { key: weak, label: "ضعف (گلوگاه بالقوه)", min: 0, max: 10, max_inclusive: false }
    - { key: growing, label: "در حال رشد", min: 10, max: 15, max_inclusive: false }
    - { key: strong, label: "قوی", min: 15, max: 20, max_inclusive: true }
  # نوارهای موقت بلوغ کل روی مقیاس ۰..۱۰۰ (عین سند نهایی؛ نیم‌باز)
  maturity_bands_provisional:
    - { key: nascent, label: نوپا, min: 0, max: 40, max_inclusive: false }
    - { key: forming, label: "در حال شکل‌گیری", min: 40, max: 60, max_inclusive: false }
    - { key: maturing, label: "در حال بلوغ", min: 60, max: 80, max_inclusive: false }
    - { key: mature, label: بالغ, min: 80, max: 100, max_inclusive: true }
  # سؤال‌های معکوس سند (نمره = ۱۰ − پاسخ) — برای ردیابی؛ جهت در پرسش‌نامه است
  reverse_items: [L1-Q2, L2-Q3, L3-Q2, L4-Q3, L5-Q3]

# تفسیر
interpretation:
  # توضیح متنی برای هر پرسش: اختیاری (تصمیم مالک محصول)
  explanation_required: false
  # متن‌های آزاد در مسیر «تفسیر عمیق AI» به مدل ارسال می‌شوند (تصمیم مالک محصول).
  # در متن رضایت‌نامه صریح ذکر می‌شود؛ کاربر یا می‌پذیرد یا داده وارد نمی‌کند.
  explanations_to_ai: true
  # سقف طول هر توضیح (کاراکتر) — محافظت از هزینهٔ توکن و کیفیت
  max_explanation_chars: 600
  # حداکثر تعداد توضیحاتی که در بستهٔ ارسالی به مدل می‌آید (به ترتیب اهمیت لایه)
  max_explanations_in_payload: 40

# کلیدهای مدیر (تا زمان داشبورد، مقدار اولیه از اینجا خوانده می‌شود و در
# جدول settings دیتابیس قابل تغییر است)
admin_keys:
  deep_interpretation: false   # علی‌رغم دیاگرام: پیش‌فرض خاموش
  ai_interpretation: false     # فقط اگر deep روشن باشد معنا دارد
