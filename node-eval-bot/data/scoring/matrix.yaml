# ---------------------------------------------------------------------------
# سیاست محاسبهٔ «عارضه‌یابی پنج‌لایه» (مرحلهٔ ۲)
# منبع: سند «عارضه‌یابی پنج‌لایه»، بخش ۳ (نظام امتیازدهی و رادار بلوغ):
#   هر لایه ۰ تا ۲۰ · مجموع ۱۰۰ · کم‌امتیازترین لایه = گلوگاه بحرانی
# لایه‌ها وزن برابر دارند (۱٫۰۰) تا نمرهٔ کل دقیقاً مجموع نمرهٔ لایه‌ها شود.
# آستانه‌ها با نوارهای سند سازگارند (۰..۱۰۰): ≥۷۵ مطلوب · ۶۰..۷۵ مرزی ·
# ۴۰..۶۰ نیازمند اصلاح · <۴۰ بحرانی — معادل ۰..۲۰: ≥۱۵ · ۱۲ · ۸.
# ---------------------------------------------------------------------------
version: matrix-score-2.0.0

# امتیاز مطلوب هر لایه/کل (مبنای محاسبهٔ شکاف) — معادل ۱۵ از ۲۰ در هر لایه
target_index: 75

# نمرهٔ ≤ این مقدار روی هر گزاره (مقیاس ۰..۱۰) = «عارضهٔ مشاهده‌شده»
symptom_threshold: 4

# دسته‌بندی نهایی هر لایه و کل بر پایهٔ شاخص ۰..۱۰۰
severity_bands:
  healthy: 75       # ≥ 75 → مطلوب (≥۱۵ از ۲۰)
  borderline: 60    # 60..75 → مرزی
  needs_fix: 40     # 40..60 → نیازمند اصلاح
  # کمتر از 40 → بحرانی

# قرارداد سند پنج‌لایه (برای گزارش و رادار بلوغ)
five_layer:
  per_layer_max: 20
  total_max: 100
  bottleneck_rule: lowest_layer

# تفسیر
interpretation:
  # توضیح متنی برای هر پرسش: اختیاری (تصمیم مالک محصول)
  explanation_required: false
  # متن‌های آزاد در مسیر «تفسیر عمیق AI» به مدل ارسال می‌شوند (تصمیم مالک محصول).
  # در متن رضایت‌نامه صریح ذکر می‌شود؛ کاربر یا می‌پذیرد یا داده وارد نمی‌کند.
  explanations_to_ai: true
  # سقف طول هر توضیح (کاراکتر) — محافظت از هزینهٔ توکن و کیفیت
  max_explanation_chars: 600
  # حداکثر تعداد توضیحاتی که در بستهٔ ارسالی به مدل می‌آید (به ترتیب اهمیت لایه)
  max_explanations_in_payload: 40

# کلیدهای مدیر (تا زمان داشبورد، مقدار اولیه از اینجا خوانده می‌شود و در
# جدول settings دیتابیس قابل تغییر است)
admin_keys:
  deep_interpretation: false   # علی‌رغم دیاگرام: پیش‌فرض خاموش
  ai_interpretation: false     # فقط اگر deep روشن باشد معنا دارد
