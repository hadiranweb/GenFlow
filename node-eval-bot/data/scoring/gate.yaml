# ---------------------------------------------------------------------------
# سیاست محاسبهٔ ارزیابی ذهنیت — MindsetGate-EP، ۱۲ سؤال رنجی MG-A/B/C
# منبع: «آرشیو — بانک سوالات v0»، شیت MindsetGate-EP (۱۵): فقط ۱۲ سؤال
# خودگزارشی فعال‌اند؛ سه سناریوی SJT فعلاً خارج از این build هستند.
#
# نمرهٔ معکوس: ۱۰ − پاسخ خام (MG-A3, MG-B3, MG-C3).
# وزن سه محور برابر است و در هر محور ۴ سؤال با وزن برابر وجود دارد.
# خروجی فقط لیبل داخلی است؛ هیچ مسدودسازی یا نمایش به کاربر نداریم.
# ---------------------------------------------------------------------------
version: score-3.0.0
mode: weighted_scale
weighting: question_level

zones:
  - key: green
    min: 70
    label: "🟢 سبز"
    description: الگوی پاسخ سازنده؛ لیبل داخلی و غیرمسدودکننده.
    color: "#16a34a"
  - key: yellow
    min: 40
    label: "🟡 زرد"
    description: الگوی پاسخ میانه؛ لیبل داخلی و غیرمسدودکننده.
    color: "#d97706"
  - key: red
    min: 0
    label: "🔴 قرمز"
    description: الگوی پاسخ نیازمند توجه؛ لیبل داخلی و غیرمسدودکننده.
    color: "#dc2626"

# بانک فعال MG-A/B/C پرسش کلیدی ندارد؛ این تنظیم خنثی و برای سازگاری موتور است.
critical_ceiling:
  critical_red_max: 2
  critical_yellow_max: 4
  unanswered_is_flagged: false

# گاردهای کیفیت پاسخ فقط اطمینان را تنظیم می‌کنند؛ مسیر را متوقف نمی‌کنند.
unknown:
  min_completeness: 0.80
  require_critical_answered: false
  max_straight_line_run: 8
  max_within_dimension_dispersion: 0.45
  min_median_seconds_per_answer: 2.5

# سنجه‌های رفتاریِ باقی‌مانده از فرایند قبلی؛ در محاسبهٔ ۱۲ سؤال دخالت ندارند.
behaviors:
  action_to_complain_target: 2
  min_self_sufficiency_retries: 1

# موتور مستقل SJT برای آزمون‌های دیگر حفظ شده اما در بانک فعال فراخوانی نمی‌شود.
mindset:
  knockout_on_red: false
  red_count_for_knockout: 99
  min_green_ratio_for_pass: 1.0
  require_all_axes_answered: true
  guards:
    min_median_seconds_per_scenario: 3.0
    max_same_position_share: 0.80
    min_answered: 10

weighted_scale:
  unknown:
    min_completeness: 0.80
    require_critical_answered: false
    max_straight_line_run: 8
    max_within_dimension_dispersion: 0.45
    min_median_seconds_per_answer: 2.5
  zones:
    - key: green
      min: 70
      label: "🟢 سبز"
      description: الگوی پاسخ سازنده.
      color: "#16a34a"
    - key: yellow
      min: 40
      label: "🟡 زرد"
      description: الگوی پاسخ میانه.
      color: "#d97706"
    - key: red
      min: 0
      label: "🔴 قرمز"
      description: الگوی پاسخ نیازمند توجه.
      color: "#dc2626"
