# ---------------------------------------------------------------------------
# مرحلهٔ ۱ — «ارزیابی نود»: سنجش نگرش (۱۵ پرسش / ۸ محور)
#
# منبع: پیش‌نویس مالک محصول `docs/reference/stage1-screening.owner-draft.yaml`
#       + دیاگرام فرایند اصلی `docs/diagrams/main-process.drawio.xml`
#
# ⚠️ تصمیم تأییدشدهٔ مالک محصول (۱۴۰۵/۰۷/۲۰): این لیبل به «نوع تفکر فعلی فرد»
#    اشاره دارد، نه به وضعیت کسب‌وکار. پس پرسش‌ها از جنس «اهمیت/باور» نوشته
#    شده‌اند (مطابق مثال دیاگرام: «چقدر مهم است؟»). محورها و وزن‌ها همان
#    پیش‌نویس است.
#
# 🔒 خروجی این بخش یک «لیبل» است، نه فیلتر:
#    - به کاربر نمایش داده نمی‌شود
#    - در ادامهٔ فرایند هیچ دخالتی نمی‌کند (نه انتخاب پرسش‌ها، نه تفسیر)
#    - فقط برای مدیر ثبت و ذخیره می‌شود
#
# مقیاس: ۰ = اصلاً مهم نیست/باور ندارم · ۱۰ = کاملاً مهم است/کاملاً باورمندم
# ---------------------------------------------------------------------------
key: gate
mode: weighted_scale
version: gate-attitude-1.0.0
title: ارزیابی نود — شناخت اولیه
intro: >-
  در این بخش، نگاه و اولویت‌های شما را می‌سنجیم: هر گزاره را با عددی از ۰ تا ۱۰
  ارزیابی کنید. هیچ پاسخ درست یا غلطی وجود ندارد؛ ما فقط می‌خواهیم بدانیم شما
  چه چیزی را مهم می‌دانید تا تحلیل بعدی دقیق‌تر تنظیم شود.
scale_min: 0
scale_max: 10

sections:
  - code: ownership
    title: نقش و مالکیت
    weight: 1.20
    questions:
      - code: s01
        text: تا چه حد باور دارید که تعیین مالک مشخص و مکتوب‌کردن اختیارات او برای موفقیت این نود حیاتی است؟
        low: اصلاً مهم نیست
        high: کاملاً حیاتی است
        critical: true
        indicator: ownership_belief

  - code: process
    title: فرآیند و مستندسازی
    weight: 1.00
    questions:
      - code: s02
        text: چقدر برای شما مهم است که فرآیندهای اصلی نود به‌صورت مکتوب (پلی‌بوک/چک‌لیست) ثبت شده باشند؟
        low: ثبت‌نکردن را ترجیح می‌دهم
        high: کاملاً ضروری می‌دانم
        indicator: process_belief
      - code: s03
        text: تا چه حد باور دارید هر فرآیند کلیدی باید ورودی، خروجی و معیار موفقیت روشنی داشته باشد؟
        low: نیازی نمی‌بینم
        high: کاملاً باورمندم
        indicator: process_belief

  - code: data
    title: داده و سنجه
    weight: 1.10
    questions:
      - code: s04
        text: چقدر برای شما مهم است که داده‌های کلیدی کسب‌وکار در یک محل مشخص و قابل اتکا نگهداری شود؟
        low: نگهداری پراکنده مشکلی ندارد
        high: کاملاً مهم است
        indicator: data_belief
      - code: s05
        text: تا چه حد باور دارید تعریف و پایش منظم شاخص‌های کلیدی عملکرد (KPI) ضروری است؟
        low: ضرورتی نمی‌بینم
        high: کاملاً ضروری است
        critical: true
        indicator: data_belief

  - code: standard
    title: استاندارد و کیفیت
    weight: 1.10
    questions:
      - code: s06
        text: چقدر برای شما مهم است که استانداردها و الزامات قانونی مرتبط با این فعالیت شناسایی و رعایت شوند؟
        low: اهمیت چندانی نمی‌دهم
        high: کاملاً مهم است
        critical: true
        indicator: standard_belief
      - code: s07
        text: تا چه حد مهم است که کنترل کیفیت خروجی‌ها (بازبینی/چک‌لیست) به‌صورت روتین انجام شود؟
        low: بازبینی ضروری نیست
        high: کاملاً ضروری است
        indicator: standard_belief

  - code: automation
    title: اتوماسیون و ابزار
    weight: 0.90
    questions:
      - code: s08
        text: چقدر استفاده از ابزار دیجیتال مناسب (CRM/ERP/سامانهٔ تخصصی) را برای این نود ضروری می‌دانید؟
        low: ابزار ضروری نیست
        high: کاملاً ضروری است
        indicator: automation_belief
      - code: s09
        text: تا چه حد باور دارید کارهای تکراری باید خودکار یا استاندارد شوند؟
        low: همان روش دستی کافی است
        high: کاملاً باورمندم
        critical: true
        indicator: automation_belief

  - code: people
    title: مهارت و تیم
    weight: 1.05
    questions:
      - code: s10
        text: چقدر مهم است که مهارت‌های لازم برای اجرای این نود در تیم موجود باشد؟
        low: می‌شود با افراد غیرمتخصص پیش رفت
        high: کاملاً مهم است
        indicator: people_belief
      - code: s11
        text: تا چه حد باور دارید دانش کلیدی نود باید مستند و قابل انتقال به فرد جدید باشد؟
        low: دانش در ذهن افراد کافی است
        high: کاملاً باورمندم
        indicator: people_belief

  - code: market
    title: بازار و مشتری
    weight: 1.05
    questions:
      - code: s12
        text: چقدر برای شما مهم است که مشتری هدف و ارزش پیشنهادی نود به‌روشنی تعریف شده باشد؟
        low: لازم نمی‌بینم
        high: کاملاً مهم است
        indicator: market_belief
      - code: s13
        text: تا چه حد مهم است که جریان ورود مشتری/فروش قابل پیش‌بینی و تکرارپذیر باشد؟
        low: هر چه پیش بیاید
        high: کاملاً مهم است
        indicator: market_belief

  - code: finance
    title: پایداری مالی
    weight: 1.15
    questions:
      - code: s14
        text: تا چه حد باور دارید درآمد و هزینه‌های نود باید به‌صورت منظم اندازه‌گیری و تحلیل شود؟
        low: نیازی به تحلیل منظم نمی‌بینم
        high: کاملاً باورمندم
        critical: true
        indicator: finance_belief
      - code: s15
        text: چقدر مهم است که نود حداقل به نقطهٔ سربه‌سر رسیده یا مسیر روشنی برای آن داشته باشد؟
        low: اهمیت چندانی نمی‌دهم
        high: کاملاً مهم است
        indicator: finance_belief

# ---------------------------------------------------------------------------
# قاعدهٔ ناسازگاری: فقط برای علامت‌گذاری در پرونده (بدون اثر بر لیبل یا مسیر)
# ---------------------------------------------------------------------------
consistency_rules:
  - code: data_metric_inconsistency
    title: ناسازگاری نگرش دربارهٔ داده و سنجه
    when:
      - { question: s04, op: '>=', value: 8 }
      - { question: s05, op: '<=', value: 3 }
    message: >-
      نگهداری دادهٔ قابل اتکا را مهم می‌دانید اما پایش شاخص‌های عملکرد را نه؛
      این ترکیب در گفت‌وگو روشن شود.
