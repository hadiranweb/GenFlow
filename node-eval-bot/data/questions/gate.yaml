# ---------------------------------------------------------------------------
# ارزیابی ذهنیت — بانک فعال: ۱۲ پرسش رنجی MindsetGate-EP (MG-A/B/C)
#
# منبع حقیقت: فایل «آرشیو — بانک سوالات v0 (پیش‌نویس اولیه).xlsx»،
# شیت «MindsetGate-EP (۱۵)». از آن شیت فقط ۱۲ سؤال خودگزارشی MG-A1…MG-C4
# فعال است. سه سناریوی SJT (S1…S3) فعلاً انتخاب نشده‌اند.
# متن دقیق سؤال‌ها و ردیابی منبع: docs/reference/mindsetgate-ep-12-owner-copy.json
#
# سه سؤال معکوس: MG-A3، MG-B3، MG-C3؛ نمرهٔ مؤثر = ۱۰ − پاسخ خام.
# سه محور با ۴ سؤال هرکدام و وزن برابر دارند.
#
# اصل محصول: خروجی این بخش صرفاً یک لیبل داخلی است؛ فیلتر نیست، مسیر را متوقف
# نمی‌کند و به کاربر نمایش داده نمی‌شود.
# ---------------------------------------------------------------------------
key: gate
mode: weighted_scale
version: gate-mindset-ep-1.0.0
title: ارزیابی ذهنیت — MindsetGate-EP
intro: >-
  در این بخش ۱۲ گزاره را از ۰ تا ۱۰ ارزیابی کنید. سه گزاره جهت معکوس دارند و
  برای آن‌ها نمرهٔ مؤثر در محاسبه برعکس می‌شود. هیچ پاسخی مسیر شما را متوقف نمی‌کند.
scale_min: 0
scale_max: 10

sections:
  - code: locus_of_control
    title: منبع کنترل
    description: سنجش جهت‌گیری فرد در نسبت دادن نتایج به تصمیم‌ها و اقدام‌های خودش یا عوامل بیرونی.
    weight: 1.00
    questions:
      - code: mg_a1
        source_ref: MG-A1
        text: "در مقیاس ۰ تا ۱۰، وقتی کاری نتیجه نمی‌دهد، چقدر ابتدا در تصمیم یا اقدام خودم دنبال علت می‌گردم؟"
        response: range
        indicator: locus_of_control
      - code: mg_a2
        source_ref: MG-A2
        text: "در مقیاس ۰ تا ۱۰، تا چه اندازه فکر می‌کنید بیشتر نتایج زندگی‌تان را تلاش خودتان تعیین می‌کند نه شانس؟"
        response: range
        indicator: locus_of_control
      - code: mg_a3
        source_ref: MG-A3
        text: "در مقیاس ۰ تا ۱۰، تا چه اندازه احساس می‌کنید اتفاقات مهم زندگی‌تان بدون دخالت شما رخ می‌دهد؟"
        polarity: reverse
        response: range
        indicator: locus_of_control
      - code: mg_a4
        source_ref: MG-A4
        text: "در مقیاس ۰ تا ۱۰، وقتی یک نرم‌افزار خطا می‌دهد، چقدر قبل از مقصر دانستن آن، خودتان راه‌حلی جست‌وجو می‌کنید؟"
        response: range
        indicator: locus_of_control

  - code: agency
    title: فاعلیت و خودتنظیمی
    description: سنجش ابتکار عمل، پیگیری راه‌حل و ادامه‌دادن کار هنگام ناکامی.
    weight: 1.00
    questions:
      - code: mg_b1
        source_ref: MG-B1
        text: "در مقیاس ۰ تا ۱۰، وقتی یک فرم یا سامانه جدید را نمی‌فهمید، چقدر ابتدا خودتان راهنما را می‌خوانید و امتحان می‌کنید؟"
        response: range
        indicator: agency
      - code: mg_b2
        source_ref: MG-B2
        text: "در مقیاس ۰ تا ۱۰، وقتی در ثبت‌نام یا استفاده از یک سامانه با اشکال مواجه می‌شوید، چقدر با امتحان روش‌های دیگر مشکل را دنبال می‌کنید؟"
        response: range
        indicator: agency
      - code: mg_b3
        source_ref: MG-B3
        text: "در مقیاس ۰ تا ۱۰، وقتی کاری با اشکال مواجه می‌شود، چقدر تمایل دارید آن را رها کنید تا کس دیگری حلش کند؟"
        polarity: reverse
        response: range
        indicator: agency
      - code: mg_b4
        source_ref: MG-B4
        text: "در مقیاس ۰ تا ۱۰، در شرایط ناکامی تا چه اندازه می‌توانید ناراحتی خود را کنترل کرده و کار را ادامه دهید؟"
        response: range
        indicator: agency

  - code: problem_solving
    title: تفکر مسئله‌محور
    description: سنجش جمع‌آوری اطلاعات، تمرکز بر راه‌حل و انتخاب مسیر جایگزین.
    weight: 1.00
    questions:
      - code: mg_c1
        source_ref: MG-C1
        text: "در مقیاس ۰ تا ۱۰، در موقعیت مبهم، چقدر ابتدا اطلاعات جمع می‌کنید و گزینه‌ها را مقایسه می‌کنید؟"
        response: range
        indicator: problem_solving
      - code: mg_c2
        source_ref: MG-C2
        text: "در مقیاس ۰ تا ۱۰، وقتی درباره یک مشکل صحبت می‌کنید، چقدر تمرکز شما بر پیشنهاد راه‌حل است تا بیان ناراحتی؟"
        response: range
        indicator: problem_solving
      - code: mg_c3
        source_ref: MG-C3
        text: "در مقیاس ۰ تا ۱۰، وقتی مشکلی پیش می‌آید، چقدر بیشتر وقت خود را صرف توصیف نارضایتی می‌کنید؟"
        polarity: reverse
        response: range
        indicator: problem_solving
      - code: mg_c4
        source_ref: MG-C4
        text: "در مقیاس ۰ تا ۱۰، اگر راه اول جواب ندهد، چقدر سریع راه جایگزین امتحان می‌کنید؟"
        response: range
        indicator: problem_solving

consistency_rules: []
