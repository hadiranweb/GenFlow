# ---------------------------------------------------------------------------
# درگاه احراز هویت اکوسیستم — فیلتر آستانهٔ الگوی ذهنی (Mindset Threshold Gate)
# موتور: SJT + معیار حذفی صریح (Knock-out) — بایگانی/نمونهٔ غیرفعال
#
# منبع طراحی: docs/diagrams/mindset-threshold-gate.json
#   سه محور: منبع کنترل · فاعلیت و خودتنظیمی · تفکر مسئله‌محور
#   هر سؤال یک «سناریوی اصطکاک فرضی در فرم احراز هویت» است و هر گزینه یک سیگنال:
#     red    → مقصر دانستن سیستم / طلبکاری / غر زدن  →  Knock-out
#     yellow → انفعال و انتظار برای حل مشکل توسط دیگران  →  Hold (ورود مشروط)
#     green  → ارائه راهکار / جستجوی راه جایگزین / فاعلیت  →  Pass
#
# ⚠️ این فایل بانک فعال ارزیابی نیست؛ بانک فعال فعلی ۱۲ رنج MG-A/B/C در gate.yaml است.
# ⚠️ این فایل نمونهٔ جداگانهٔ ۱۵ سناریوی SJT است و بانک فعال ارزیابی نیست.
#    بانک فعال فعلی: ۱۲ پرسش رنجی MG-A/B/C در gate.yaml.
# ⚠️ متن سناریوها و گزینه‌ها «پیش‌نویس» است و باید با محتوای تأییدشدهٔ خودتان
#    جایگزین شود. ساختار (سناریو + سه سیگنال + rationale) نهایی است.
#
# ⚠️ طراحی گزینه‌ها: جایگاه گزینهٔ سبز/زرد/قرمز عمداً بین سناریوها جابه‌جا می‌شود
#    تا سوگیری «همیشه گزینهٔ اول» خنثی شود و گارد «الگوی تکرارشونده» معنا پیدا کند.
# ---------------------------------------------------------------------------
key: gate
mode: sjt_knockout
version: gate-mindset-1.0.0
title: درگاه احراز هویت — آستانهٔ الگوی ذهنی
intro: >-
  این درگاه، یک آزمون کوتاه قضاوت موقعیتی است: چند سناریوی واقعیِ «اصطکاک در ورود»
  را می‌بینید و از میان پاسخ‌های ممکن، نزدیک‌ترین رفتار خودتان را انتخاب می‌کنید.
  هیچ پاسخ «درست/غلط» وجود ندارد؛ ما فقط می‌خواهیم بدانیم در مواجهه با مشکل،
  راهکار پیشنهاد می‌دهید یا منتظر می‌مانید یا مسئولیت را به سیستم می‌سپارید.
scale_min: 0
scale_max: 10

sections:
  # ======================= محور ۱: منبع کنترل =======================
  - code: locus_of_control
    title: منبع کنترل
    description: مسئولیت‌پذیری در برابر مشکلات و عدم انتساب ناکامی به عوامل بیرونی (Internal Locus of Control)
    weight: 0.34
    questions:
      - code: loc_form_reset
        text: در میانهٔ فرم ثبت‌نام، صفحه ری‌ست می‌شود و اطلاعاتی که وارد کرده بودید پاک می‌شود.
        indicator: framing
        critical: true
        options:
          - key: a
            text: فرم را دوباره پر می‌کنم و هم‌زمان به پشتیبانی اطلاع می‌دهم چه بخشی از فرم مشکل دارد تا سریع‌تر برطرف شود.
            signal: green
            rationale: هم اقدام عملی، هم گزارش مسئله‌محور به‌جای شکایت محض.
          - key: b
            text: منتظر می‌مانم تا کسی از تیم شما مشکل را ببیند و اطلاع بدهد، فرم را دست نمی‌زنم.
            signal: yellow
            rationale: انفعال و انتقال حل مسئله به دیگران.
          - key: c
            text: این سیستم معلوم نیست چطور کار می‌کند؛ هر بار یک مشکل تازه دارد و وقت من تلف می‌شود.
            signal: red
            rationale: انتساب ناکامی به سیستم بدون هیچ سهم‌دهی به خود یا اقدام اصلاحی.

      - code: loc_wrong_field
        text: پس از ارسال فرم متوجه می‌شوید یکی از فیلدها را اشتباه پر کرده‌اید و همین باعث توقف فرایند شده است.
        indicator: self_attribution
        critical: true
        options:
          - key: a
            text: تقصیر سیستم است؛ فرم نباید اجازهٔ چنین اشتباهی بدهد و باید خودش اصلاح کند.
            signal: red
            rationale: مقصر دانستن کامل سیستم در خطای کاربر.
          - key: b
            text: بررسی می‌کنم کجا اشتباه کردم، اصلاح می‌کنم و اگر امکان ویرایش نبود، با ذکر دقیق فیلد درخواست کمک می‌دهم.
            signal: green
            rationale: سهم‌دهی به خود همراه با درخواست کمک مشخص و قابل‌اقدام.
          - key: c
            text: فعلاً رهایش می‌کنم؛ اگر لازم باشد خودشان پیگیری می‌کنند.
            signal: yellow
            rationale: رهاشدن بدون اقدام، حتی وقتی راه اصلاح در دسترس است.

      - code: loc_permission_delay
        text: بعد از ثبت‌نام، دسترسی شما به بخش اصلی چند روز طول می‌کشد و علتش هم روشن نیست.
        indicator: framing
        options:
          - key: a
            text: سؤال می‌کنم دقیقاً کدام شرط باقی مانده و همان را انجام می‌دهم تا دسترسی سریع‌تر فعال شود.
            signal: green
            rationale: تبدیل ابهام به اقدام مشخص و قابل پیگیری.
          - key: b
            text: شکایت می‌کنم که چرا همه‌چیز عقب می‌افتد و این‌طور نمی‌توان کار کرد.
            signal: red
            rationale: شکایت بدون درخواست اطلاعات یا اقدام.
          - key: c
            text: منتظر می‌مانم؛ بالاخره یک روزی فعال می‌شود.
            signal: yellow
            rationale: انتظار منفعل بدون پیگیری.

      - code: loc_unclear_rules
        text: قوانین این اکوسیستم برایتان مبهم است و نمی‌دانید دقیقاً چه چیزی مجاز و چه چیزی ممنوع است.
        indicator: framing
        options:
          - key: a
            text: فهرست سؤال‌هایم را می‌نویسم و یک‌جا می‌پرسم تا قوانین را روشن کنم و بعد ادامه دهم.
            signal: green
            rationale: رویکرد ساختاریافته به ابهام.
          - key: b
            text: معمولاً قوانین این‌جور جاها بی‌دلیل سخت‌گیرانه است و کسی هم پاسخ روشن نمی‌دهد.
            signal: red
            rationale: پیش‌داوری منفی و نقد بدون تلاش برای روشن‌سازی.
          - key: c
            text: کاری به قوانین ندارم؛ همان‌طور که بقیه می‌روند، جلو می‌روم.
            signal: yellow
            rationale: بی‌تفاوتی نسبت به ابهام، بدون اقدام برای رفع آن.

      - code: loc_teammate_error
        text: یکی از هم‌کارانتان اطلاعات ناقص داده و به همین دلیل کار شما در فرایند ورود عقب افتاده است.
        indicator: self_attribution
        options:
          - key: a
            text: موضوع را روشن و بی‌اتهام‌زنی مطرح می‌کنم، اطلاعات درست را می‌فرستم و پیگیری می‌کنم که دوباره تکرار نشود.
            signal: green
            rationale: حل مسئله و پیشگیری از تکرار، بدون فرافکنی.
          - key: b
            text: به تیم اعلام می‌کنم کل کار به‌خاطر اشتباه فلانی متوقف شده و تا حل نشود جلو نمی‌روم.
            signal: red
            rationale: تمرکز روی مقصر به‌جای حل مسئله.
          - key: c
            text: صبر می‌کنم خودش متوجه شود و درست کند.
            signal: yellow
            rationale: انفعال در برابر مسئله‌ای که خودم هم متأثر می‌شوم.

  # ================= محور ۲: فاعلیت و خودتنظیمی =================
  - code: agency_resilience
    title: فاعلیت و خودتنظیمی
    description: تاب‌آوری در برابر اصطکاک‌های اولیه و تلاش برای حل مشکل پیش از درخواست کمک (Agency & Resilience)
    weight: 0.33
    questions:
      - code: ag_slow_page
        text: صفحهٔ ثبت‌نام برای چند دقیقه کند یا بی‌پاسخ می‌شود.
        indicator: friction
        critical: true
        options:
          - key: a
            text: همان لحظه پیام می‌دهم که سیستم‌تان به‌درد‌نخور است و باید درستش کنید.
            signal: red
            rationale: واکنش به اصطکاک با اتهام، بدون آزمودن راه‌های ساده.
          - key: b
            text: مرورگر/اینترنت و اینترنت جایگزین را امتحان می‌کنم، بعد در ساعت دیگری دوباره تلاش می‌کنم و اگر باز نشد، با جزئیات گزارش می‌دهم.
            signal: green
            rationale: تلاش مستقل و سپس گزارش فنی قابل‌اقدام.
          - key: c
            text: رها می‌کنم و می‌گویم بعداً یک نفر دیگر پیگیری کند.
            signal: yellow
            rationale: توقف تلاش و انتقال کار به دیگران.

      - code: ag_sms_code
        text: کد تأیید پیامکی برای شما ارسال نمی‌شود.
        indicator: retry
        critical: true
        options:
          - key: a
            text: چند دقیقه صبر می‌کنم، شماره و بخش اسپم/پیام‌های تبلیغاتی را بررسی می‌کنم، درخواست ارسال دوباره می‌دهم و اگر نشد دقیقاً همین مراحل را گزارش می‌کنم.
            signal: green
            rationale: الگوی «تلاش مستقل قبل از درخواست کمک» — همان سنجهٔ Self-Sufficiency.
          - key: b
            text: پیام می‌دهم که کد نمی‌آید و منتظر راه‌حل می‌مانم.
            signal: yellow
            rationale: اقدام حداقلی و انتظار برای حل توسط دیگران.
          - key: c
            text: این سیستم ابتدایی‌ترین کارش را هم درست انجام نمی‌دهد.
            signal: red
            rationale: تعمیم ناکامی به کل سیستم، بدون تلاش برای حل.

      - code: ag_ticket_delay
        text: تیکت پشتیبانی شما ۲۴ ساعت بی‌پاسخ مانده است.
        indicator: friction
        options:
          - key: a
            text: پیگیری می‌کنم و هم‌زمان دنبال راهنمایی مستند یا راه جایگزین در منابع آموزشی می‌گردم تا کارم متوقف نماند.
            signal: green
            rationale: فعال ماندن روی مسیر، حتی وقتی پاسخ بیرونی تأخیر دارد.
          - key: b
            text: در گروه می‌نویسم که پشتیبانی اینجا خیلی ضعیف است و کسی جواب نمی‌دهد.
            signal: red
            rationale: عمومی‌کردن گلایه به‌جای پیگیری هدفمند.
          - key: c
            text: تمام کارهایم را تا رسیدن پاسخ متوقف می‌کنم.
            signal: yellow
            rationale: وابستگی کامل پیشرفت کار به دیگران.

      - code: ag_upload_bug
        text: هنگام بارگذاری مدرک، خطای تکرارشدنی می‌گیرید و فایل ارسال نمی‌شود.
        indicator: retry
        options:
          - key: a
            text: با فرمت یا حجم متفاوت دوباره امتحان می‌کنم؛ اگر خطا تکرار شد، متن دقیق خطا و مراحلی که انجام دادم را می‌فرستم.
            signal: green
            rationale: آزمودن جایگزین + گزارش دقیق و بازتولیدپذیر.
          - key: b
            text: چند بار دیگر روی همان دکمه می‌زنم و بعد رها می‌کنم.
            signal: yellow
            rationale: تکرار بدون تغییر روش و سپس رهاکردن.
          - key: c
            text: این سیستم برای کار جدی ساخته نشده.
            signal: red
            rationale: نتیجه‌گیری کلیِ منفی و بی‌کاربرد.

      - code: ag_restart_lost
        text: سرویس وسط کار ری‌استارت می‌شود و گفت‌وگوی نیمه‌کارهٔ شما ناتمام می‌ماند.
        indicator: friction
        options:
          - key: a
            text: سیستم مقصر است؛ باید همه‌چیز را خودش ذخیره کند و درخواست من را از اول انجام دهد.
            signal: red
            rationale: انتقال کامل مسئولیت پیگیری به سیستم.
          - key: b
            text: از همان‌جایی که مانده بودم ادامه می‌دهم و اگر بخشی از پاسخ‌ها گم شده باشد بازنویسی می‌کنم.
            signal: green
            rationale: تاب‌آوری و ادامهٔ کار با کمترین اتلاف.
          - key: c
            text: فعلاً رهایش می‌کنم تا حال‌وحوصلهٔ کافی داشته باشم.
            signal: yellow
            rationale: تعویق بی‌زمان و بدون درخواست کمک.

  # ================= محور ۳: تفکر مسئله‌محور =================
  - code: problem_solving
    title: تفکر مسئله‌محور
    description: رویکرد ساختاریافته به ابهام و تلاش برای بهبود به‌جای غر زدن منفعلانه (Problem-Solving Orientation)
    weight: 0.33
    questions:
      - code: ps_payment_mismatch
        text: مبلغ پرداخت شما با آنچه توافق کرده بودید، تفاوت دارد.
        indicator: action_to_complain
        critical: true
        options:
          - key: a
            text: منتظر می‌مانم شاید خودشان متوجه شوند و اصلاح کنند.
            signal: yellow
            rationale: انتظار برای اصلاح خودکار، بدون پیگیری.
          - key: b
            text: مستندات پرداخت را بررسی می‌کنم، تفاوت را دقیق مشخص می‌کنم و با ارائهٔ سند درخواست اصلاح می‌دهم.
            signal: green
            rationale: بیان مسئله + شاهد + درخواست مشخص (نسبت اقدام به شکایت بالا).
          - key: c
            text: این‌طور جاها همه سرشان کلاه می‌رود؛ اعتمادم سلب شد.
            signal: red
            rationale: اتهام و بدبینی بدون بررسی داده یا درخواست اصلاح.

      - code: ps_feature_not_ready
        text: متوجه می‌شوید بخشی از سرویس که به آن نیاز دارید هنوز آماده نیست.
        indicator: action_to_complain
        options:
          - key: a
            text: دقیقاً می‌نویسم به چه قابلیتی نیاز دارم، برای چه کاری، و چه جایگزینی می‌توانم استفاده کنم؛ سپس مسیر را ادامه می‌دهم.
            signal: green
            rationale: "مسئله‌محور: نیاز + کاربرد + راه جایگزین."
          - key: b
            text: پیام می‌دهم چرا سرویس ناقص عرضه شده و تا کامل نشود کاری انجام نمی‌دهم.
            signal: red
            rationale: اعتراض بدون پیشنهاد یا مسیر جایگزین.
          - key: c
            text: کاری نمی‌کنم؛ اگر لازم بود خودشان خبر می‌دهند.
            signal: yellow
            rationale: نبود اقدام و پیگیری.

      - code: ps_auto_response
        text: پاسخ خودکار پشتیبانی، سؤال شما را نفهمیده و راهنمای بی‌ربط فرستاده است.
        indicator: action_to_complain
        options:
          - key: a
            text: با یک پیام کوتاه و روشن، سؤال را دوباره و با جزئیات دقیق‌تر می‌پرسم تا به جواب درست برسم.
            signal: green
            rationale: بازتعریف مسئله برای گرفتن پاسخ، به‌جای رهاکردن.
          - key: b
            text: نتیجه می‌گیرم پشتیبانی اینجا فقط ربات است و دیگر پیام نمی‌دهم.
            signal: yellow
            rationale: توقف تلاش با فرض منفی دربارهٔ طرف مقابل.
          - key: c
            text: می‌نویسم که این پشتیبانی به هیچ‌کدام از سؤال‌ها پاسخ نمی‌دهد.
            signal: red
            rationale: تخطئهٔ کلی سیستم بدون درخواست مشخص.

      - code: ps_improve_onboarding
        text: حس می‌کنید فرایند ورود طولانی و پر از گام‌های بی‌فایده است.
        indicator: framing
        options:
          - key: a
            text: مراحل را یادداشت می‌کنم و می‌گویم کدام گام‌ها قابل حذف یا ادغام‌اند و چرا؛ پیشنهاد مشخص می‌فرستم.
            signal: green
            rationale: نقد سازنده با پیشنهاد اجرایی — نمونهٔ ایده‌آل «بیان مسئله + راهکار».
          - key: b
            text: در هر گفت‌وگویی این فرایند را به‌عنوان نمونهٔ بی‌نظمی مثال می‌زنم.
            signal: red
            rationale: تکرار گلایه بدون ارائهٔ راهکار.
          - key: c
            text: تحملش می‌کنم و رد می‌شوم؛ مشکلی نیست.
            signal: yellow
            rationale: پذیرش منفعل وضعیت و نبود سهم در بهبود.

      - code: ps_unclear_next_step
        text: در ادامهٔ مسیر نمی‌دانید گام بعدی شما چیست و چه‌کسی مسئول آن است.
        indicator: framing
        critical: true
        options:
          - key: a
            text: می‌پرسم گام بعدی، مسئولش و زمان آن چه است؛ اگر پاسخ روشن نبود، خودم پیشنهاد می‌دهم و تأیید می‌گیرم.
            signal: green
            rationale: تبدیل ابهام به تعهد قابل‌پیگیری.
          - key: b
            text: منتظر می‌مانم تا کسی مرا راهنمایی کند.
            signal: yellow
            rationale: انتظار برای هدایت بیرونی.
          - key: c
            text: معلوم نیست اینجا چه‌کسی مسئول چیست؛ همه توپ را به هم پاس می‌دهند.
            signal: red
            rationale: نقد کلی و بی‌اقدام، بدون درخواست روشن.

# ---------------------------------------------------------------------------
# قواعد ناسازگاری در حالت SJT معنا ندارند (سیگنال هر گزینه خودش تفسیر را دارد).
# اگر لازم شد، در آینده می‌توان قاعده‌هایی مثل «همه سبز + زمان بسیار کم» را
# به گاردهای mindset در data/scoring/gate.yaml اضافه کرد.
# ---------------------------------------------------------------------------
consistency_rules: []
