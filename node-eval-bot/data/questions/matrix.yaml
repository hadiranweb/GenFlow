# ---------------------------------------------------------------------------
# مرحلهٔ ۲ — «عارضه‌یابی پنج‌لایه» (۱۹ پرسش / ۵ لایه: ۴+۴+۴+۴+۳ — عین ساختار سند)
#
# منبع حقیقت: سند «عارضه‌یابی پنج‌لایه» (عارضه‌یابی پنج‌لایه.pdf، ۵ صفحه)
#   ساختار سند: ۱) فرم عارضه‌یابی ۲) گزارش ماتریسی شکاف ۳) نظام امتیازدهی
#   متن کامل استخراج‌شدهٔ سند: docs/reference/five-layer-source.md
#
# تبدیل قالب پاسخ (تصمیم اجرایی این پیاده‌سازی):
#   قالب‌های اصلی سند ناهمگون‌اند (طیف ۱تا۵، درصدی، بله/خیر/مبهم، گزینه‌ای).
#   برای سازگاری داده و سابقهٔ «دو ساید» (رنج + توضیح اختیاری)، همهٔ پرسش‌ها
#   به گزارهٔ قابل نمره‌دهی روی مقیاس یکدست ۰..۱۰ تبدیل شده‌اند؛ قالب و متن
#   اصلی هر پرسش در فیلدهای source_format و source_prompt حفظ شده است تا
#   هیچ ردی از منبع از بین نرود (source_ref، keyword_refs).
#
# نمره‌دهی (نظام امتیازدهی سند): هر لایه ۰ تا ۲۰، مجموع ۱۰۰.
#   score0to20(لایه) = میانگین نرمال‌شدهٔ پرسش‌های لایه × ۲۰
#   چون هر ۵ لایه وزن برابر (۱٫۰۰) دارند، نمرهٔ کل = مجموع نمرهٔ لایه‌ها.
#
# پرسش کلیدی هر لایه (critical): آزمونی‌ترین پرسش لایه انتخاب شده است:
#   حاکمیت L1-Q1 (واگذاری بدون مالک) · معماری L2-Q2 (پوشش SOP)
#   جاری‌سازی L3-Q1 (آزمون غیبت ۴ هفته‌ای) · نگهداشت L4-Q1 (داشبورد KPI)
#   توسعه L5-Q1 (سه‌برابرشدن حجم کار)
#
# بخش عمومی سند (اطلاعات پایه و نبض کسب‌وکار: حوزهٔ فعالیت، تعداد پرسنل،
# ساعات مدیر) در data/vocab/interpretation-matrix.yaml زیر کلید
# general_section ثبت شده و هنوز در جریان گفت‌وگوی ربات نیست؛ افزودنش
# نیازمند پشتیبانی از ورودی انتخابی/متنی آزاد در بات است (فاز بعد).
#
# مقیاس: ۰ = اصلاً برقرار نیست · ۱۰ = کاملاً برقرار است
# ---------------------------------------------------------------------------
key: matrix
mode: weighted_scale
version: matrix-five-layer-1.0.0
title: عارضه‌یابی پنج‌لایهٔ سیستم‌سازی
intro: >-
  در این بخش، وضعیت واقعی کسب‌وکار را در ۵ لایهٔ سیستم‌سازی می‌سنجیم. هر گزاره را
  با عددی از ۰ تا ۱۰ ارزیابی کنید (۰ = اصلاً برقرار نیست، ۱۰ = کاملاً برقرار است).
  اگر خواستید، می‌توانید برای هر گزاره توضیح کوتاهی هم بنویسید.
scale_min: 0
scale_max: 10

sections:
  # ---------------- لایهٔ ۱ — حاکمیت (Governance) ----------------
  - code: governance
    title: حاکمیت
    description: سنجش مالکیت، استراتژی و تلهٔ کارآفرینی؛ شفافیت چشم‌انداز، تفکیک نقش مالک از مجری و تخصیص منابع.
    weight: 1.00
    questions:
      - code: l1q1
        text: "اگر مالک فردا کنار بکشد، خریدار یک «سیستم مستقل» تحویل می‌گیرد و کسب‌وکار بدون او متوقف نمی‌شود."
        critical: true
        response: range+text
        source_ref: L1-Q1
        source_format: "طیف ۱ تا ۵"
        source_prompt: "اگر فردا بخواهید کسب‌وکارتان را بفروشید یا واگذار کنید، خریدار یک «سیستم مستقل» تحویل می‌گیرد یا با رفتن شما کسب‌وکار متوقف می‌شود؟"
        keyword_refs: [L1-K3]
        indicator: "تلهٔ کارآفرینی — وابستگی کسب‌وکار به حضور مالک"
      - code: l1q2
        text: "بخش عمدهٔ زمان هفتگی مالک صرف طراحی استراتژی و مسیر آینده می‌شود، نه انجام کارهای اجرایی و فنی روزمره."
        response: range+text
        source_ref: L1-Q2
        source_format: "درصدی (سهم زمان اجرایی در برابر استراتژیک)"
        source_prompt: "چقدر از زمان هفتگی شما صرف «انجام کارهای اجرایی و فنی» می‌شود و چقدر صرف «طراحی استراتژی و مسیر آینده»؟"
        keyword_refs: [L1-K3]
        indicator: "سهم زمان طراحی مالک در برابر زمان اجرا"
      - code: l1q3
        text: "اهداف ۳ماهه و سالانهٔ کسب‌وکار مکتوب و شفاف است و با شرکا یا مدیران تسهیم شده است."
        response: range+text
        source_ref: L1-Q3
        source_format: "گزینه‌ای: بله / خیر / مبهم"
        source_prompt: "آیا اهداف ۳ ماهه و سالانه کسب‌وکار به صورت مکتوب و شفاف با شرکا یا مدیران تسهیم شده است؟"
        keyword_refs: [L1-K1]
        indicator: "مکتوب و تسهیم‌شده بودن اهداف"
      - code: l1q4
        text: "حساب‌وکتاب مالی و برداشت شخصی مالک کاملاً از سود واقعی و نقدینگی عملیاتی شرکت تفکیک شده است."
        response: range+text
        source_ref: L1-Q4
        source_format: "گزینه‌ای: کاملاً تفکیک‌شده / تا حدی مخلوط / کاملاً وابسته به جیب مالک"
        source_prompt: "حساب و کتاب مالی و برداشت شخصی شما تا چه حد از سود واقعی و نقدینگی عملیاتی شرکت تفکیک شده است؟"
        keyword_refs: [L1-K2]
        indicator: "تفکیک مالی مالک از شرکت"

  # ---------------- لایهٔ ۲ — معماری و طراحی (Architecture) ----------------
  - code: architecture
    title: معماری و طراحی
    description: سنجش فرایندها و مستندات؛ شفافیت جریان کارها، دستورالعمل‌ها (SOP) و چک‌لیست‌ها.
    weight: 1.00
    questions:
      - code: l2q1
        text: "مسیر مشتری از جذب تا تحویل خدمت/محصول مکتوب و در قالب نقشهٔ فرایند یا فلوچارت ترسیم شده است."
        response: range+text
        source_ref: L2-Q1
        source_format: "گزینه‌ای: فقط در ذهن افراد / یادداشت‌های پراکنده / فلوچارت و نقشهٔ فرایند مکتوب"
        source_prompt: "مسیر ورود مشتری از جذب (Marketing) تا تحویل خدمت/محصول (Delivery) تا چه حد مکتوب و ترسیم شده است؟"
        keyword_refs: [L2-K1, L2-K2]
        indicator: "مکتوب بودن زنجیرهٔ ارزش مشتری"
      - code: l2q2
        text: "بیشتر کارهای روتین و تکراری شرکت دستورالعمل اجرایی گام‌به‌گام (SOP) یا چک‌لیست (۱-۲-۳) دارند."
        critical: true
        response: range+text
        source_ref: L2-Q2
        source_format: "درصدی: زیر ۲۰٪ / بین ۲۰ تا ۶۰٪ / بالای ۶۰٪"
        source_prompt: "چند درصد از کارهای روتین و تکراری شرکت دارای دستورالعمل اجرایی گام‌به‌گام (SOP) یا چک‌لیست (۱-۲-۳) هستند؟"
        keyword_refs: [L2-K2, L2-K3]
        indicator: "پوشش SOP روی کارهای روتین"
      - code: l2q3
        text: "کارمند جدید با تکیه بر اسناد و آموزش مکتوب راه می‌افتد و برای یادگیری کار به هفته‌ها همراهی تجربی کنار دیگران نیاز ندارد."
        response: range+text
        source_ref: L2-Q3
        source_format: "گزارهٔ رنجی (تبدیل‌شده از پرسش باز سند)"
        source_prompt: "وقتی یک کارمند جدید استخدام می‌شود، با تکیه بر اسناد و آموزش مکتوب راه می‌افتد یا باید هفته‌ها کنار دست شما یا بقیه بنشیند تا تجربی کار را یاد بگیرد؟"
        keyword_refs: [L2-K2, L2-K3]
        indicator: "استقلال ورود نیروی جدید از تجربهٔ شفاهی"
      - code: l2q4
        text: "ماتریس شفافی برای مسئولیت‌ها وجود دارد که مسئول نهایی هر خروجی را مشخص می‌کند و مرز وظایف شناور و نامشخص نیست."
        response: range+text
        source_ref: L2-Q4
        source_format: "گزارهٔ رنجی (تبدیل‌شده از پرسش باز سند)"
        source_prompt: "آیا ماتریس شفافی برای مسئولیت‌ها وجود دارد که مشخص کند مسئول نهایی هر خروجی کیست، یا مرز وظایف شناور و نامشخص است؟"
        keyword_refs: [L2-K3]
        indicator: "شفافیت مسئول نهایی هر خروجی (RACI)"

  # ---------------- لایهٔ ۳ — جاری‌سازی (Implementation) ----------------
  - code: implementation
    title: جاری‌سازی
    description: سنجش استقلال تیم و تغییر رفتار؛ توانایی پرسنل در اجرای خودکار فرایندها بدون پیگیری مداوم مدیر.
    weight: 1.00
    questions:
      - code: l3q1
        text: "اگر مدیر یا مالک ۴ هفتهٔ متوالی در دسترس نباشد، کارها با اختلال اندک پیش می‌روند و شرکت فلج نمی‌شود."
        critical: true
        response: range+text
        source_ref: L3-Q1
        source_format: "گزینه‌ای: فلج کامل / افت شدید کیفیت / کارها با اختلال اندک پیش می‌روند / بدون تغییر و رشدیافته"
        source_prompt: "اگر ۴ هفته متوالی به مسافرت بروید و تلفن خود را خاموش کنید، وضعیت شرکت در بازگشت چگونه خواهد بود؟"
        keyword_refs: [L3-K1, L3-K3]
        indicator: "آزمون غیبت مدیر — تداوم عملیات بدون مالک"
      - code: l3q2
        text: "پرسنل برای تصمیم‌گیری‌های خرد، تأیید نهایی یا حل مسائل روزمره به‌ندرت (کمتر از ۳ بار در روز) به مدیر مراجعه می‌کنند."
        response: range+text
        source_ref: L3-Q2
        source_format: "گزینه‌ای: بیش از ۱۰ بار / ۳ تا ۱۰ بار / کمتر از ۳ بار در روز"
        source_prompt: "روزانه چند بار پرسنل برای تصمیم‌گیری‌های خرد، تأیید نهایی یا حل مسائل روزمره به شما مراجعه می‌کنند؟"
        keyword_refs: [L3-K1, L3-K2]
        indicator: "فراوانی ارجاع تصمیم‌های خرد به مدیر (تفویض معکوس)"
      - code: l3q3
        text: "تیم در عمل به دستورالعمل‌ها پایبند است و کارها به‌علت نبود فرهنگ سیستم‌پذیری به شیوهٔ سنتی افراد برنمی‌گردد."
        response: range+text
        source_ref: L3-Q3
        source_format: "گزارهٔ رنجی (تبدیل‌شده از پرسش باز سند)"
        source_prompt: "آیا تیم به دستورالعمل‌ها پایبند است یا به دلیل نبود فرهنگ سیستم‌پذیری، دوباره کارها را به شیوه سنتی خودشان انجام می‌دهند؟"
        keyword_refs: [L3-K1, L3-K2]
        indicator: "پایبندی رفتاری تیم به سیستم (فرهنگ سیستم‌پذیری)"
      - code: l3q4
        text: "فرایندها و آموزش‌ها در عمل جاری شده‌اند و دستورالعمل‌های نوشته‌شده بلااستفاده و خاک‌خورده باقی نمانده‌اند."
        response: range+text
        source_ref: L3-Q4
        source_format: "گزارهٔ رنجی (تبدیل‌شده از پرسش باز سند)"
        source_prompt: "آیا فرآیندها و آموزش‌ها در عمل جاری شده‌اند، یا دستورالعمل‌ها نوشته شده اما خاک می‌خورند؟"
        keyword_refs: [L3-K1, L3-K2]
        indicator: "جاری‌شدن واقعی مستندات در رفتار روزمره"

  # ---------------- لایهٔ ۴ — نگهداشت و پایش (Maintenance) ----------------
  - code: maintenance
    title: نگهداشت و پایش
    description: سنجش داشبوردها و رفع باگ‌ها؛ پایش مستمر خروجی‌ها در برابر اهداف، KPIها و سازوکارهای بازخورد.
    weight: 1.00
    questions:
      - code: l4q1
        text: "وضعیت کسب‌وکار با داشبورد هفتگی شاخص‌های کلیدی عددی (KPI) رصد می‌شود، نه با حس ششم و موجودی حساب بانکی."
        critical: true
        response: range+text
        source_ref: L4-Q1
        source_format: "گزینه‌ای: حس ششم و موجودی حساب / گزارش‌های پراکندهٔ پرسنل / داشبورد هفتگی KPIهای عددی"
        source_prompt: "وضعیت کسب‌وکار را بر اساس چه ابزاری رصد می‌کنید؟"
        keyword_refs: [L4-K1]
        indicator: "ابزار رصد وضعیت — داشبورد عددی در برابر شهود"
      - code: l4q2
        text: "جلسات تیم ریتم هفتگی روتین، ساختاریافته و مسئله‌محور دارند و فقط هنگام وقوع بحران تشکیل نمی‌شوند."
        response: range+text
        source_ref: L4-Q2
        source_format: "گزینه‌ای: جلسات نامنظم هنگام بحران / جلسات هفتگی روتین و مسئله‌محور"
        source_prompt: "ریتم جلسات تیم چگونه است؟"
        keyword_refs: [L4-K2]
        indicator: "ریتم منضبط جلسات پایش"
      - code: l4q3
        text: "با خطای تکراری در خدمت یا کیفیت، سیستم به‌جای سرزنش یا جریمهٔ کارمند، باگ فرایند را بررسی و دستورالعمل مکتوب را به‌روزرسانی می‌کند."
        response: range+text
        source_ref: L4-Q3
        source_format: "گزینه‌ای: سرزنش یا جریمهٔ کارمند / بررسی باگ فرایند و آپدیت دستورالعمل"
        source_prompt: "وقتی خطای تکراری در ارائه خدمت یا کیفیت رخ می‌دهد، سیستم چطور واکنش نشان می‌دهد؟"
        keyword_refs: [L4-K3]
        indicator: "واکنش سیستمی به خطای تکراری (RCA/CAPA در برابر سرزنش)"
      - code: l4q4
        text: "نظام گزارش‌دهی تا حد زیادی خودکار است و بدون نیاز به پرس‌وجوی مدیر، انحراف از اهداف را هشدار می‌دهد."
        response: range+text
        source_ref: L4-Q4
        source_format: "گزارهٔ رنجی (تبدیل‌شده از پرسش باز سند)"
        source_prompt: "چقدر سیستم گزارش‌دهی خودکار است و بدون نیاز به پرس‌وجوی شما، انحراف از اهداف را هشدار می‌دهد؟"
        keyword_refs: [L4-K1, L4-K3]
        indicator: "خودکار بودن گزارش‌دهی و هشدار انحراف"

  # ---------------- لایهٔ ۵ — توسعه و مقیاس‌پذیری (Scaling) ----------------
  - code: scaling
    title: توسعه و مقیاس‌پذیری
    description: سنجش پتانسیل تکثیر و رشد؛ آمادگی برای تکثیر سیستم، فرانچایز، شعب یا تنوع درآمدی.
    weight: 1.00
    questions:
      - code: l5q1
        text: "اگر حجم سفارش‌ها یا مشتریان در ماه آینده ۳ برابر شود، سیستم به‌راحتی مقیاس می‌گیرد و کیفیت از هم نمی‌پاشد."
        critical: true
        response: range+text
        source_ref: L5-Q1
        source_format: "گزینه‌ای: کسب‌وکار از هم می‌پاشد / با استخدام خطی نیرو پاسخ داده می‌شود / سیستم به راحتی مقیاس می‌گیرد"
        source_prompt: "اگر حجم سفارش‌ها یا مشتریان شما در ماه آینده ۳ برابر شود، چه اتفاقی می‌افتد؟"
        keyword_refs: [L5-K2, L5-K3]
        indicator: "آزمون سه‌برابرشدن حجم — کشش سیستم"
      - code: l5q2
        text: "مدل کسب‌وکار قابلیت تکثیر دارد؛ یعنی شعبهٔ جدید، نمایندگی یا خط درآمدی تازه بدون حضور مالک قابل راه‌اندازی است."
        response: range+text
        source_ref: L5-Q2
        source_format: "گزارهٔ رنجی (تبدیل‌شده از پرسش باز سند)"
        source_prompt: "آیا مدل کسب‌وکار شما قابلیت تکثیر (افتتاح شعبه جدید، اعطای نمایندگی یا ایجاد خط درآمدی جدید بدون حضور شما) را دارد؟"
        keyword_refs: [L5-K1, L5-K2]
        indicator: "تکثیرپذیری مدل بدون حضور مالک"
      - code: l5q3
        text: "گلوگاه اصلی رشد شناسایی شده و برای رفع آن برنامهٔ مشخصی فراتر از زمان فیزیکی مالک یا استخدام خطی نیرو وجود دارد."
        response: range+text
        source_ref: L5-Q3
        source_format: "گزینه‌ای (تشخیص گلوگاه): زمان فیزیکی مالک / ظرفیت عملیاتی تیم / بازاریابی و جذب / نقدینگی"
        source_prompt: "گلوگاه اصلی رشد در حال حاضر چیست؟"
        keyword_refs: [L5-K2, L5-K3]
        indicator: "شناسایی و برنامهٔ رفع گلوگاه رشد"

consistency_rules: []
