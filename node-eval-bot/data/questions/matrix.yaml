# ---------------------------------------------------------------------------
# مرحلهٔ ۲ — «عارضه‌یابی پنج‌لایه» نسخهٔ ۰ تا ۱۰ (۲۰ پرسش / ۵ لایه × ۴ پرسش)
#
# منبع حقیقت: سند «عارضه‌یابی پنج لایه - نسخه ۰ تا ۱۰ (طبق پلی‌بوک)»
#   (version: 0.1-draft · status: draft_pilot_required)
#   متن کامل سند: docs/reference/five-layer-source.md
#
# در این نسخه، تبدیل قالب پاسخ دیگر کار ما نیست: خود سند هر پرسش را طبق
# «پلی‌بوک ساخت سؤال ۰ تا ۱۰» به مقیاس ۰..۱۰ تبدیل کرده است. متن پرسش‌ها،
# لنگرهای ۰/۵/۱۰ و جهت نمره‌دهی (reverse_scored) عین سند است:
#   reverse_scored: true → polarity: reverse (نمرهٔ مؤثر = ۱۰ − پاسخ)
#   پرسش‌های معکوس سند: L1-Q2 · L2-Q3 · L3-Q2 · L4-Q3 · L5-Q3
# پرسش L5-Q4 تازهٔ خود سند است («سؤال جدید پلی‌بوک برای رسیدن به ۲۰ سؤال» —
# اقتصاد واحد، از کلیدواژهٔ L5-K2) و لایهٔ ۵ را به ۴ پرسش رسانده است.
#
# نمره‌دهی (بخش ۳ سند): نمرهٔ لایه = مجموع ۴ نمرهٔ تعدیل‌شده ÷ ۲ (بازه ۰..۲۰)
#   ≡ میانگین نرمال‌شده × ۲۰ · نمرهٔ کل = مجموع ۵ لایه (۰..۱۰۰)
#   گلوگاه بحرانی = کم‌امتیازترین لایه؛ در تساوی، لایهٔ بالادستی‌تر (شماره کمتر).
#
# پرسش کلیدی هر لایه (critical): آزمونی‌ترین پرسش لایه:
#   حاکمیت L1-Q1 · معماری L2-Q2 · جاری‌سازی L3-Q1 · نگهداشت L4-Q1 · توسعه L5-Q1
#
# بخش عمومی سند (اطلاعات پایه و نبض کسب‌وکار؛ بدون نمره) در
# data/vocab/interpretation-matrix.yaml زیر کلید general_section ثبت شده و
# هنوز در جریان گفت‌وگوی ربات نیست (نیازمند ورودی انتخابی/عددی — فاز بعد).
# زمان تقریبی تکمیل فرم طبق سند: ۸ دقیقه.
#
# مقیاس: جهت مقیاس در کل فرم ثابت است (پلی‌بوک): ۰ = کمترین سطح ویژگی،
# ۱۰ = بیشترین سطح؛ در پرسش‌های معکوس، لنگرها خودِ جهت خام را توضیح می‌دهند.
# ---------------------------------------------------------------------------
key: matrix
mode: weighted_scale
version: matrix-five-layer-1.1.0
title: عارضه‌یابی پنج‌لایهٔ سیستم‌سازی
intro: >-
  در این بخش، وضعیت واقعی کسب‌وکار را در ۵ لایهٔ سیستم‌سازی می‌سنجیم. هر سؤال را
  با عددی از ۰ تا ۱۰ پاسخ دهید؛ برای هر سؤال، معنای ۰، ۵ و ۱۰ زیر آن آمده است.
  اگر خواستید، می‌توانید برای هر سؤال توضیح کوتاهی هم بنویسید.
scale_min: 0
scale_max: 10

sections:
  # ---------------- لایهٔ ۱ — حاکمیت (Governance) ----------------
  - code: governance
    title: حاکمیت
    description: "سنجش مالکیت، استراتژی و تله کارآفرینی. سازه: میزان جداسازی نقش مالک از اجرا و وجود استراتژی مکتوب و تسهیم‌شده."
    weight: 1.00
    questions:
      - code: l1q1
        text: "در مقیاس ۰ تا ۱۰، اگر امروز بخواهید کسب‌وکار را واگذار کنید، تا چه اندازه کسب‌وکار بدون حضور شما به‌عنوان یک سیستم مستقل قابل انتقال است؟"
        critical: true
        response: range+text
        low: "کاملاً وابسته به من؛ با رفتن من متوقف می‌شود"
        mid: "بخشی از کار بدون من پیش می‌رود"
        high: "سیستم مستقل؛ خریدار فرایندها و مسئولیت‌ها را تحویل می‌گیرد"
        source_ref: L1-Q1
        keyword_refs: [L1-K3]
        indicator: "تلهٔ کارآفرینی — وابستگی کسب‌وکار به حضور مالک"
      - code: l1q2
        text: "در مقیاس ۰ تا ۱۰، چه سهمی از زمان هفتگی شما صرف کارهای اجرایی و فنی روزمره می‌شود؟"
        polarity: reverse
        response: range+text
        low: "هیچ زمانی برای اجرا صرف نمی‌کنم"
        mid: "حدود نیمی از زمانم اجرایی است"
        high: "تقریباً تمام زمانم صرف اجرا می‌شود"
        source_ref: L1-Q2
        keyword_refs: [L1-K3]
        indicator: "سهم زمان اجرایی مالک (معکوس: ۱۰ یعنی وابستگی زیاد)"
      - code: l1q3
        text: "در مقیاس ۰ تا ۱۰، اهداف ۳ ماهه و سالانه کسب‌وکار تا چه اندازه مکتوب، شفاف و با شرکا یا مدیران تسهیم شده است؟"
        response: range+text
        low: "هیچ هدف مکتوبی وجود ندارد"
        mid: "اهداف مکتوب است اما مبهم یا تسهیم‌نشده"
        high: "مکتوب، شفاف و با همه شرکا یا مدیران تسهیم شده"
        source_ref: L1-Q3
        keyword_refs: [L1-K1]
        indicator: "مکتوب و تسهیم‌شده بودن اهداف"
      - code: l1q4
        text: "در مقیاس ۰ تا ۱۰، حساب‌های مالی شرکت و برداشت شخصی شما تا چه اندازه از هم تفکیک شده‌اند؟"
        response: range+text
        low: "کاملاً وابسته به جیب مالک"
        mid: "تا حدی مخلوط"
        high: "کاملاً تفکیک‌شده"
        source_ref: L1-Q4
        keyword_refs: [L1-K2]
        indicator: "تفکیک مالی مالک از شرکت"

  # ---------------- لایهٔ ۲ — معماری و طراحی (Architecture) ----------------
  - code: architecture
    title: معماری و طراحی
    description: "سنجش فرآیندها و مستندات. سازه: میزان مکتوب بودن فرایندهای حیاتی، پوشش SOP و وضوح مسئولیت‌ها."
    weight: 1.00
    questions:
      - code: l2q1
        text: "در مقیاس ۰ تا ۱۰، مسیر کامل مشتری از جذب (بازاریابی) تا تحویل خدمت یا محصول تا چه اندازه مکتوب و ترسیم شده است؟"
        response: range+text
        low: "فقط در ذهن افراد است"
        mid: "یادداشت‌های پراکنده"
        high: "فلوچارت یا نقشه فرایند مکتوب و به‌روز"
        source_ref: L2-Q1
        keyword_refs: [L2-K1, L2-K2]
        indicator: "مکتوب بودن زنجیرهٔ ارزش مشتری"
      - code: l2q2
        text: "در مقیاس ۰ تا ۱۰، چه سهمی از کارهای روتین و تکراری شرکت دستورالعمل گام‌به‌گام (SOP) یا چک‌لیست دارد؟"
        critical: true
        response: range+text
        low: "هیچ‌کدام"
        mid: "حدود نیمی از آن‌ها"
        high: "تقریباً همه آن‌ها"
        source_ref: L2-Q2
        keyword_refs: [L2-K2, L2-K3]
        indicator: "پوشش SOP روی کارهای روتین"
      - code: l2q3
        text: "در مقیاس ۰ تا ۱۰، کارمند جدید تا چه اندازه برای یادگیری کار به تجربی و کنار دست دیگران وابسته است؟"
        polarity: reverse
        response: range+text
        low: "کاملاً مستقل؛ با اسناد و آموزش مکتوب راه می‌افتد"
        mid: "نیمی از یادگیری با اسناد و نیمی کنار دیگران"
        high: "کاملاً وابسته؛ هفته‌ها کنار دیگران می‌نشیند"
        source_ref: L2-Q3
        keyword_refs: [L2-K2, L2-K3]
        indicator: "وابستگی ورود نیروی جدید به تجربهٔ شفاهی (معکوس)"
      - code: l2q4
        text: "در مقیاس ۰ تا ۱۰، ماتریس مسئولیت‌ها تا چه اندازه مشخص می‌کند مسئول نهایی هر خروجی کیست؟"
        response: range+text
        low: "مرز وظایف شناور و نامشخص است"
        mid: "مسئولیت‌ها تا حدی مشخص است"
        high: "برای هر خروجی مالک و مسئول نهایی مشخص است"
        source_ref: L2-Q4
        keyword_refs: [L2-K3]
        indicator: "شفافیت مسئول نهایی هر خروجی (RACI)"

  # ---------------- لایهٔ ۳ — جاری‌سازی (Implementation) ----------------
  - code: implementation
    title: جاری‌سازی
    description: "سنجش استقلال تیم و تغییر رفتار. سازه: میزان استقلال تیم در اجرای فرایندها و پایبندی به دستورالعمل‌ها در غیاب مالک."
    weight: 1.00
    questions:
      - code: l3q1
        text: "در مقیاس ۰ تا ۱۰، اگر ۴ هفته متوالی غایب باشید و در دسترس نباشید، شرکت در بازگشت شما تا چه اندازه بدون افت کیفیت به کار ادامه داده است؟"
        critical: true
        response: range+text
        low: "فلج کامل"
        mid: "کارها با افت کیفیت و اختلال زیاد پیش رفته‌اند"
        high: "بدون تغییر و حتی با رشد"
        source_ref: L3-Q1
        keyword_refs: [L3-K1, L3-K3]
        indicator: "آزمون غیبت مدیر — تداوم عملیات بدون مالک"
      - code: l3q2
        text: "در مقیاس ۰ تا ۱۰، روزانه چند بار پرسنل برای تصمیم‌های خرد یا تأیید نهایی به شما مراجعه می‌کنند؟ (۰ = تقریباً هیچ، ۱۰ = بیش از ۱۰ بار)"
        polarity: reverse
        response: range+text
        low: "تقریباً هیچ مراجعه‌ای نیست (کمتر از ۳ بار)"
        mid: "حدود ۳ تا ۱۰ بار در روز"
        high: "بیش از ۱۰ بار در روز"
        source_ref: L3-Q2
        keyword_refs: [L3-K1, L3-K2]
        indicator: "فراوانی ارجاع تصمیم‌های خرد به مدیر (تفویض معکوس)"
      - code: l3q3
        text: "در مقیاس ۰ تا ۱۰، تیم تا چه اندازه به دستورالعمل‌ها پایبند است و کارها را طبق آن‌ها انجام می‌دهد؟"
        response: range+text
        low: "کارها کاملاً به شیوه سنتی و شخصی انجام می‌شود"
        mid: "گاهی پایبند است و گاهی به روش قدیمی برمی‌گردد"
        high: "تیم به‌طور مستمر طبق دستورالعمل عمل می‌کند"
        source_ref: L3-Q3
        keyword_refs: [L3-K1, L3-K2]
        indicator: "پایبندی رفتاری تیم به سیستم (فرهنگ سیستم‌پذیری)"
      - code: l3q4
        text: "در مقیاس ۰ تا ۱۰، فرایندها و آموزش‌های نوشته‌شده تا چه اندازه در عمل جاری شده‌اند؟"
        response: range+text
        low: "نوشته نشده یا کاملاً بایگانی شده است"
        mid: "بخشی جاری و بخشی بایگانی شده است"
        high: "همه جاری شده و در عمل استفاده می‌شوند"
        source_ref: L3-Q4
        keyword_refs: [L3-K1, L3-K2]
        indicator: "جاری‌شدن واقعی مستندات در رفتار روزمره"

  # ---------------- لایهٔ ۴ — نگهداشت و پایش (Maintenance) ----------------
  - code: maintenance
    title: نگهداشت و پایش
    description: "سنجش داشبوردها و رفع باگ‌ها. سازه: میزان پایش عددی عملکرد، انضباط جلسات، و یادگیری سازمانی از خطاها."
    weight: 1.00
    questions:
      - code: l4q1
        text: "در مقیاس ۰ تا ۱۰، وضعیت کسب‌وکار تا چه اندازه با داشبورد عددی و شاخص‌های مشخص رصد می‌شود؟"
        critical: true
        response: range+text
        low: "فقط با حس و موجودی حساب بانکی"
        mid: "با گزارش‌های پراکنده و غیرمنظم"
        high: "با داشبورد هفتگی KPI که هدف و روند دارد"
        source_ref: L4-Q1
        keyword_refs: [L4-K1]
        indicator: "ابزار رصد وضعیت — داشبورد عددی در برابر شهود"
      - code: l4q2
        text: "در مقیاس ۰ تا ۱۰، جلسات تیم تا چه اندازه منظم، ساختاریافته و مسئله‌محور برگزار می‌شوند؟"
        response: range+text
        low: "فقط هنگام بروز بحران"
        mid: "گاهی منظم و گاهی نامنظم"
        high: "جلسه هفتگی روتین با دستورجلسه و پیگیری اقدامات"
        source_ref: L4-Q2
        keyword_refs: [L4-K2]
        indicator: "ریتم منضبط جلسات پایش"
      - code: l4q3
        text: "در مقیاس ۰ تا ۱۰، وقتی خطای تکراری در خدمت یا کیفیت رخ می‌دهد، تا چه اندازه پاسخ سیستم سرزنش یا جریمه فرد است؟"
        polarity: reverse
        response: range+text
        low: "هرگز؛ همیشه فرایند بررسی می‌شود"
        mid: "گاهی سرزنش و گاهی بررسی فرایند"
        high: "همیشه سرزنش یا جریمه فرد"
        source_ref: L4-Q3
        keyword_refs: [L4-K3]
        indicator: "واکنش به خطای تکراری (معکوس: سرزنش در برابر بررسی فرایند)"
      - code: l4q4
        text: "در مقیاس ۰ تا ۱۰، سیستم گزارش‌دهی شما تا چه اندازه بدون نیاز به پرس‌وجو، انحراف از اهداف را خودکار هشدار می‌دهد؟"
        response: range+text
        low: "هیچ هشداری وجود ندارد"
        mid: "هشدارها دستی و گاهی انجام می‌شوند"
        high: "هشدار خودکار و به‌موقع وجود دارد"
        source_ref: L4-Q4
        keyword_refs: [L4-K1, L4-K3]
        indicator: "خودکار بودن گزارش‌دهی و هشدار انحراف"

  # ---------------- لایهٔ ۵ — توسعه و مقیاس (Scaling) ----------------
  - code: scaling
    title: توسعه و مقیاس
    description: "سنجش پتانسیل تکثیر و رشد نمایی. سازه: توان مقیاس‌پذیری عملیات، قابلیت تکثیر مدل بدون مالک، و اقتصاد واحد."
    weight: 1.00
    questions:
      - code: l5q1
        text: "در مقیاس ۰ تا ۱۰، اگر حجم سفارش یا مشتریان در ماه آینده سه برابر شود، کسب‌وکار تا چه اندازه بدون افت کیفیت پاسخ می‌دهد؟"
        critical: true
        response: range+text
        low: "کسب‌وکار از هم می‌پاشد و کیفیت افت شدید می‌کند"
        mid: "فقط با استخدام خطی نیرو پاسخ داده می‌شود"
        high: "سیستم به‌راحتی مقیاس می‌گیرد"
        source_ref: L5-Q1
        keyword_refs: [L5-K2, L5-K3]
        indicator: "آزمون سه‌برابرشدن حجم — کشش سیستم"
      - code: l5q2
        text: "در مقیاس ۰ تا ۱۰، مدل کسب‌وکار تا چه اندازه قابلیت تکثیر بدون حضور مستقیم شما را دارد (شعبه، نمایندگی یا خط درآمدی جدید)؟"
        response: range+text
        low: "هیچ قابلیت تکثیری ندارد"
        mid: "فقط با حضور زیاد من قابل تکثیر است"
        high: "کاملاً بدون حضور من قابل تکثیر است"
        source_ref: L5-Q2
        keyword_refs: [L5-K1, L5-K2]
        indicator: "تکثیرپذیری مدل بدون حضور مالک"
      - code: l5q3
        text: "در مقیاس ۰ تا ۱۰، زمان فیزیکی شما تا چه اندازه محدودکننده رشد کسب‌وکار است؟"
        polarity: reverse
        response: range+text
        low: "هیچ محدودیتی ایجاد نمی‌کند"
        mid: "تا حدی محدودکننده است"
        high: "کاملاً محدودکننده است؛ رشد به زمان من گره خورده"
        source_ref: L5-Q3
        keyword_refs: [L5-K2, L5-K3]
        indicator: "گلوگاه زمان فیزیکی مالک (معکوس)"
      - code: l5q4
        text: "در مقیاس ۰ تا ۱۰، با افزایش فروش، هزینه و زمان تحویل هر واحد خدمت تا چه اندازه ثابت یا کاهنده باقی می‌ماند؟"
        response: range+text
        low: "با هر فروش جدید هزینه و زمان به‌شدت بالا می‌رود"
        mid: "هزینه متناسب با رشد افزایش می‌یابد"
        high: "هزینه هر واحد با رشد ثابت یا کمتر می‌شود"
        source_ref: L5-Q4
        keyword_refs: [L5-K2, L5-K3]
        indicator: "اقتصاد واحد — هزینهٔ نهایی تحویل با رشد (پرسش تازهٔ پلی‌بوک)"

consistency_rules: []
