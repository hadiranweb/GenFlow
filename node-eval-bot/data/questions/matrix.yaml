# ---------------------------------------------------------------------------
# مرحلهٔ ۲ — «عارضه‌یابی تفصیلی» (۵۴ پرسش / ۹ محور)
#
# منبع: پیش‌نویس مالک محصول `docs/reference/stage2-diagnostics.owner-draft.yaml`
#       (متن پرسش‌ها و وزن محورها بدون تغییر، مطابق سند خودشان)
#
# ⚠️ این بخش «دو ساید» است (تصمیم دیاگرام + تأیید مالک محصول):
#      ساید ۱ → پاسخ رنجی ۰..۱۰   (وارد محاسبهٔ ماتریس می‌شود)
#      ساید ۲ → توضیح متنی        (اختیاری · وارد محاسبه نمی‌شود · فقط برای تفسیر)
#    پاسخ رنجی برای همهٔ کاربران یکسان است تا دادهٔ عارضه‌یابی سازگار بماند.
#
# مقیاس: ۰ = اصلاً برقرار نیست · ۱۰ = کاملاً برقرار است
# ---------------------------------------------------------------------------
key: matrix
mode: weighted_scale
version: matrix-diagnostics-1.0.0
title: عارضه‌یابی تفصیلی نود
intro: >-
  در این بخش، وضعیت واقعی نود را در ۹ حوزه می‌سنجیم. هر گزاره را با عددی از ۰ تا ۱۰
  ارزیابی کنید (۰ = اصلاً برقرار نیست، ۱۰ = کاملاً برقرار است). اگر خواستید، می‌توانید
  برای هر گزاره توضیح کوتاهی هم بنویسید.
scale_min: 0
scale_max: 10

sections:
  # ---------------- استراتژی و مدل کسب‌وکار ----------------
  - code: strategy
    title: استراتژی و مدل کسب‌وکار
    weight: 1.20
    questions:
      - { code: d101, text: "مدل درآمدی نود (چگونه پول درمی‌آورد) مکتوب و شفاف است.", response: range+text }
      - { code: d102, text: "بازار هدف و اندازه‌ی فرصت آن برآورد مستند دارد.", response: range+text }
      - { code: d103, text: "مزیت رقابتی ما مشخص و قابل دفاع است.", response: range+text }
      - { code: d104, text: "اهداف ۱۲ ماه آینده به اهداف فصلی و ماهانه شکسته شده است.", critical: true, response: range+text }
      - { code: d105, text: "تصمیم‌های راهبردی بر پایه‌ی داده گرفته می‌شود، نه سلیقه.", response: range+text }
      - { code: d106, text: "برنامه‌ی رشد نود (محصول، بازار، ظرفیت) مکتوب است.", response: range+text }

  # ---------------- فرآیندها و رویه‌ها ----------------
  - code: process
    title: فرآیندها و رویه‌ها
    weight: 1.15
    questions:
      - { code: d201, text: "نقشه‌ی فرآیندهای اصلی (Workflow Map) ترسیم شده است.", response: range+text }
      - { code: d202, text: "مالک و مسئول هر فرآیند مشخص است.", response: range+text }
      - { code: d203, text: "ورودی و خروجی هر فرآیند مستند است.", response: range+text }
      - { code: d204, text: "گلوگاه‌ها شناسایی شده و زمان چرخه‌ی هر فرآیند اندازه‌گیری می‌شود.", critical: true, response: range+text }
      - { code: d205, text: "رویه‌های اضطراری/جایگزین برای اختلال‌ها تعریف شده است.", response: range+text }
      - { code: d206, text: "بهبود فرآیندها چرخه‌ی منظم دارد (بازخورد ← اصلاح).", response: range+text }

  # ---------------- داده و مدل داده ----------------
  - code: data
    title: داده و مدل داده
    weight: 1.10
    questions:
      - { code: d301, text: "فیلدها و ساختار داده‌های اصلی (Data Model) تعریف شده است.", response: range+text }
      - { code: d302, text: "سطوح دسترسی و محرمانگی داده‌ها مشخص و رعایت می‌شود.", critical: true, response: range+text }
      - { code: d303, text: "پاک‌سازی داده‌ی تکراری/متناقض به‌صورت منظم انجام می‌شود.", response: range+text }
      - { code: d304, text: "گزارش‌های مدیریتی مستقیماً از داده استخراج می‌شوند (نه دستی).", response: range+text }
      - { code: d305, text: "داشبورد مدیریتی به‌روز در دسترس تصمیم‌گیرنده است.", response: range+text }
      - { code: d306, text: "مسیر بازگشت نتیجه‌ی تحلیل به عملیات روزمره برقرار است.", response: range+text }

  # ---------------- فناوری و اتوماسیون ----------------
  - code: tech
    title: فناوری و اتوماسیون
    weight: 1.05
    questions:
      - { code: d401, text: "ابزارهای فعلی پاسخ نیاز نود را می‌دهند و از هم پراکنده نیستند.", response: range+text }
      - { code: d402, text: "اتوماسیون‌های موجود پایدارند و خطای مکرر ندارند.", critical: true, response: range+text }
      - { code: d403, text: "یکپارچگی بین سامانه‌ها (API/فایل مشترک) برقرار است.", response: range+text }
      - { code: d404, text: "محیط آزمون و پشتیبان‌گیری سامانه‌ها انجام می‌شود.", response: range+text }
      - { code: d405, text: "تیم توان نگهداری ابزارها را دارد یا پشتیبانی قراردادی وجود دارد.", response: range+text }
      - { code: d406, text: "نقشه‌ی راه فناوری (چه چیزی، چه زمانی، با چه هزینه‌ای) مکتوب است.", response: range+text }

  # ---------------- استانداردها و انطباق ----------------
  - code: standard
    title: استانداردها و انطباق
    weight: 1.10
    questions:
      - { code: d501, text: "فهرست استانداردها و الزامات مرتبط به‌روز نگهداری می‌شود.", response: range+text }
      - { code: d502, text: "گواهی‌نامه‌ها/مجوزهای لازم معتبر و در دسترس‌اند.", critical: true, response: range+text }
      - { code: d503, text: "کنترل کیفیت تجهیزات/خروجی‌ها طبق دستورالعمل انجام می‌شود.", response: range+text }
      - { code: d504, text: "سوابق ممیزی و اقدامات اصلاحی نگهداری می‌شود.", response: range+text }
      - { code: d505, text: "کارکنان با الزامات قانونی مرتبط با نقش خود آشنا هستند.", response: range+text }
      - { code: d506, text: "ریسک‌های انطباقی (جریمه/توقف فعالیت) ارزیابی شده است.", response: range+text }

  # ---------------- سرمایه انسانی و آموزش ----------------
  - code: people
    title: سرمایه انسانی و آموزش
    weight: 1.05
    questions:
      - { code: d601, text: "ساختار سازمانی و شرح وظایف به‌روز است.", response: range+text }
      - { code: d602, text: "فرآیند جذب و ورود نیروی جدید (Onboarding) استاندارد دارد.", response: range+text }
      - { code: d603, text: "برنامه‌ی آموزش مهارتی به‌صورت منظم اجرا می‌شود.", response: range+text }
      - { code: d604, text: "شاخص عملکرد فردی اندازه‌گیری و بازخورد داده می‌شود.", critical: true, response: range+text }
      - { code: d605, text: "وابستگی به افراد کلیدی مدیریت شده (جایگزین/مستندسازی).", response: range+text }
      - { code: d606, text: "رضایت و ماندگاری نیروی کلیدی پایش می‌شود.", response: range+text }

  # ---------------- بازاریابی، فروش و برند ----------------
  - code: market
    title: بازاریابی، فروش و برند
    weight: 1.10
    questions:
      - { code: d701, text: "پرسونای مشتری و نیاز او مستند شده است.", response: range+text }
      - { code: d702, text: "کانال‌های جذب مشتری مشخص و اندازه‌گیری می‌شوند.", critical: true, response: range+text }
      - { code: d703, text: "قیمت‌گذاری بر پایه‌ی هزینه و ارزش انجام شده است.", response: range+text }
      - { code: d704, text: "قیف فروش (از سرنخ تا خرید) تعریف و پایش می‌شود.", response: range+text }
      - { code: d705, text: "رضایت مشتری و نرخ شکایت/بازگشت اندازه‌گیری می‌شود.", response: range+text }
      - { code: d706, text: "محتوا و هویت برند (پیام، لحن، تصویر) یکدست است.", response: range+text }

  # ---------------- مالی و بهره‌وری ----------------
  - code: finance
    title: مالی و بهره‌وری
    weight: 1.20
    questions:
      - { code: d801, text: "صورت درآمد و هزینه‌ی ماهانه تهیه می‌شود.", critical: true, response: range+text }
      - { code: d802, text: "بهای تمام‌شده‌ی محصول/خدمت محاسبه شده و به‌روز است.", response: range+text }
      - { code: d803, text: "حاشیه‌ی سود هر محصول/خدمت مشخص است.", response: range+text }
      - { code: d804, text: "برنامه‌ی نقدینگی و پیش‌بینی جریان نقدی وجود دارد.", response: range+text }
      - { code: d805, text: "هزینه‌های پنهان/هدررفت شناسایی شده و هدف کاهش دارند.", response: range+text }
      - { code: d806, text: "سرمایه‌گذاری‌ها و بازگشت آن‌ها (ROI) ارزیابی می‌شود.", response: range+text }

  # ---------------- ریسک، کیفیت و پایداری ----------------
  - code: risk
    title: ریسک، کیفیت و پایداری
    weight: 1.15
    questions:
      - { code: d901, text: "فهرست ریسک‌های اصلی (عملیاتی/مالی/حقوقی) تهیه شده است.", critical: true, response: range+text }
      - { code: d902, text: "برای ریسک‌های بحرانی برنامه‌ی کاهش/اقدام نوشته شده است.", response: range+text }
      - { code: d903, text: "بیمه/پشتیبان مناسب (تجهیزات، اطلاعات، افراد) وجود دارد.", response: range+text }
      - { code: d904, text: "حوادث و خطاها ثبت و ریشه‌یابی (عارضه‌یابی) می‌شوند.", response: range+text }
      - { code: d905, text: "نگهداری پیشگیرانه/دوره‌ای تجهیزات و سامانه‌ها انجام می‌شود.", response: range+text }
      - { code: d906, text: "وابستگی به یک مشتری/فرد/تأمین‌کننده مدیریت شده است.", response: range+text }

consistency_rules: []
