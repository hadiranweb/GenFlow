# ---------------------------------------------------------------------------
# مرحلهٔ ۲ — «عارضه‌یابی پنج‌لایه» نسخهٔ ۰ تا ۱۰ (۲۰ پرسش / ۵ لایه × ۴ پرسش)
#
# منبع حقیقت: سند «عارضه‌یابی پنج‌لایه — نسخهٔ نهایی اعمال‌شده (بر مبنای فایل اصلاحی کاربر)»
#   (نسخهٔ ۰ تا ۱۰ طبق پلی‌بوک · version: 0.1-draft · status: draft_pilot_required)
#   اصلاح نسخهٔ نهایی: مرزهای بازه‌های بلوغ پیوسته و نیم‌بازند تا نیم‌امتیازها بدون طبقه نمانند.
#   متن کامل سند: docs/reference/five-layer-source.md
#
# در این نسخه، تبدیل قالب پاسخ دیگر کار ما نیست: خود سند هر پرسش را طبق
# «پلی‌بوک ساخت سؤال ۰ تا ۱۰» به مقیاس ۰..۱۰ تبدیل کرده است. متن پرسش‌ها،
# لنگرهای ۰/۵/۱۰ و جهت نمره‌دهی (reverse_scored) عین سند است:
#   reverse_scored: true → polarity: reverse (نمرهٔ مؤثر = ۱۰ − پاسخ)
#   پرسش‌های معکوس سند: L1-Q2 · L2-Q3 · L3-Q2 · L4-Q3 · L5-Q3
# پرسش L5-Q4 تازهٔ خود سند است («سؤال جدید پلی‌بوک برای رسیدن به ۲۰ سؤال» —
# اقتصاد واحد، از کلیدواژهٔ L5-K2) و لایهٔ ۵ را به ۴ پرسش رسانده است.
#
# نمره‌دهی (بخش ۳ سند): نمرهٔ لایه = مجموع ۴ نمرهٔ تعدیل‌شده ÷ ۲ (بازه ۰..۲۰)
#   ≡ میانگین نرمال‌شده × ۲۰ · نمرهٔ کل = مجموع ۵ لایه (۰..۱۰۰)
#   گلوگاه بحرانی = کم‌امتیازترین لایه؛ در تساوی، لایهٔ بالادستی‌تر (شماره کمتر).
#
# پرسش کلیدی هر لایه (critical): آزمونی‌ترین پرسش لایه:
#   بنیان و رهبری L1-Q1 · معماری L2-Q2 · جاری‌سازی L3-Q1 · نگهداشت L4-Q1 · توسعه L5-Q1
#
# بخش عمومی سند (اطلاعات پایه و نبض کسب‌وکار؛ بدون نمره) در
# data/vocab/interpretation-matrix.yaml زیر کلید general_section ثبت شده و
# هنوز در جریان گفت‌وگوی ربات نیست (نیازمند ورودی انتخابی/عددی — فاز بعد).
# زمان تقریبی تکمیل فرم طبق سند: ۸ دقیقه.
#
# مقیاس: جهت مقیاس در کل فرم ثابت است (پلی‌بوک): ۰ = کمترین سطح ویژگی،
# ۱۰ = بیشترین سطح؛ در پرسش‌های معکوس، لنگرها خودِ جهت خام را توضیح می‌دهند.
# ---------------------------------------------------------------------------
key: matrix
mode: weighted_scale
version: matrix-five-layer-1.3.0
title: عارضه‌یابی پنج‌لایهٔ سیستم‌سازی
intro: >-
  در این بخش، وضعیت واقعی کسب‌وکار را در ۵ لایهٔ سیستم‌سازی می‌سنجیم. هر سؤال را
  با عددی از ۰ تا ۱۰ پاسخ دهید؛ برای هر سؤال، معنای ۰، ۵ و ۱۰ زیر آن آمده است.
  اگر خواستید، می‌توانید برای هر سؤال توضیح کوتاهی هم بنویسید.
scale_min: 0
scale_max: 10

sections:
  # ---------------- لایهٔ ۱ — بنیان و رهبری (Governance) ----------------
  - code: governance
    title: بنیان و رهبری
    description: "سنجش مالکیت، استراتژی و تله کارآفرینی. سازه: میزان جداسازی نقش مالک از اجرا و وجود استراتژی مکتوب و تسهیم‌شده."
    weight: 1.00
    questions:
      - code: l1q1
        text: "از ۰ تا ۱۰، اگر امروز بخواهید کسب‌وکارتان را واگذار کنید، این مجموعه چقدر به‌عنوان یک سیستم مستقل (بدون حضور شما) قابل انتقال است؟"
        critical: true
        response: range+text
        low: "اصلاً مستقل نیست (با رفتن من کسب‌وکار کاملاً متوقف می‌شود)."
        mid: "تا حدی مستقل است (بخشی از کارها بدون من پیش می‌رود)."
        high: "کاملاً مستقل است (خریدار می‌تواند تمام فرآیندها و مسئولیت‌ها را تحویل بگیرد)."
        source_ref: L1-Q1
        keyword_refs: [L1-K3]
        indicator: "تلهٔ کارآفرینی — وابستگی کسب‌وکار به حضور مالک"
      - code: l1q2
        text: "از ۰ تا ۱۰، چقدر از زمان هفتگی شما صرف کارهای اجرایی و فنی روزمره می‌شود؟"
        polarity: reverse
        response: range+text
        low: "اصلاً صرف کارهای اجرایی نمی‌شود (تمام زمانم صرف استراتژی و مدیریت می‌شود)."
        mid: "حدود نصف زمانم صرف کارهای اجرایی می‌شود."
        high: "تقریباً تمام زمانم صرف کارهای اجرایی روزمره می‌شود."
        source_ref: L1-Q2
        keyword_refs: [L1-K3]
        indicator: "سهم زمان اجرایی مالک (معکوس: ۱۰ یعنی وابستگی زیاد)"
      - code: l1q3
        text: "از ۰ تا ۱۰، اهداف کوتاه‌مدت (۳ ماهه) و بلندمدت (سالانه) کسب‌وکارتان چقدر مکتوب، شفاف و با مدیران یا شرکا به اشتراک گذاشته شده است؟"
        response: range+text
        low: "هیچ هدف مکتوبی وجود ندارد."
        mid: "اهداف مکتوب هستند، اما مبهم‌اند یا به بقیه اعلام نشده‌اند."
        high: "کاملاً مکتوب، شفاف و با همه مدیران و شرکا به اشتراک گذاشته شده‌اند."
        source_ref: L1-Q3
        keyword_refs: [L1-K1]
        indicator: "مکتوب و تسهیم‌شده بودن اهداف"
      - code: l1q4
        text: "از ۰ تا ۱۰، حساب‌های مالی شرکت و برداشت‌های شخصی شما چقدر از هم تفکیک و جدا شده‌اند؟"
        response: range+text
        low: "اصلاً تفکیک نشده است (کاملاً وابسته به جیب و حساب شخصی مالک است)."
        mid: "تا حدی تفکیک شده، اما گاهی با هم مخلوط می‌شوند."
        high: "کاملاً تفکیک شده و انضباط کامل مالی برقرار است."
        source_ref: L1-Q4
        keyword_refs: [L1-K2]
        indicator: "تفکیک مالی مالک از شرکت"

  # ---------------- لایهٔ ۲ — معماری و طراحی (Architecture) ----------------
  - code: architecture
    title: معماری و طراحی
    description: "سنجش فرآیندها و مستندات. سازه: میزان مکتوب بودن فرایندهای حیاتی، پوشش SOP و وضوح مسئولیت‌ها."
    weight: 1.00
    questions:
      - code: l2q1
        text: "از ۰ تا ۱۰، مسیر کامل مشتری (از جذب و بازاریابی تا تحویل محصول یا خدمت) چقدر مکتوب و شفاف ترسیم شده است؟"
        response: range+text
        low: "اصلاً مکتوب نیست (فقط در ذهن افراد است)."
        mid: "در قالب یادداشت‌های پراکنده وجود دارد."
        high: "کاملاً به صورت فلوچارت یا نقشه فرآیند مکتوب و به‌روز وجود دارد."
        source_ref: L2-Q1
        keyword_refs: [L2-K1, L2-K2]
        indicator: "مکتوب بودن زنجیرهٔ ارزش مشتری"
      - code: l2q2
        text: "از ۰ تا ۱۰، چقدر از کارهای روتین و تکراری شرکت دارای دستورالعمل گام‌به‌گام (SOP) یا چک‌لیست مشخص هستند؟"
        critical: true
        response: range+text
        low: "هیچ‌کدام دستورالعمل ندارند."
        mid: "حدود نصف کارهای روتین دستورالعمل دارند."
        high: "تقریباً تمام کارهای روتین دارای دستورالعمل مکتوب هستند."
        source_ref: L2-Q2
        keyword_refs: [L2-K2, L2-K3]
        indicator: "پوشش SOP روی کارهای روتین"
      - code: l2q3
        text: "از ۰ تا ۱۰، یک کارمند جدید برای یادگیری کارش چقدر به آموزش حضوری و تجربه کلامی دیگران وابسته است؟"
        polarity: reverse
        response: range+text
        low: "اصلاً وابسته نیست (با اسناد و آموزش‌های مکتوب به صورت مستقل راه می‌افتد)."
        mid: "تا حدی وابسته است (نیمی با اسناد و نیمی با آموزش حضوری)."
        high: "کاملاً وابسته است (باید هفته‌ها کنار بقیه بنشیند تا کار را یاد بگیرد)."
        source_ref: L2-Q3
        keyword_refs: [L2-K2, L2-K3]
        indicator: "وابستگی ورود نیروی جدید به تجربهٔ شفاهی (معکوس)"
      - code: l2q4
        text: "از ۰ تا ۱۰، مسئول نهاییِ هر خروجی و نتیجه در کسب‌وکارتان چقدر مشخص و شفاف است؟"
        response: range+text
        low: "اصلاً مشخص نیست (مرز وظایف و مسئولیت‌ها شناور و نامعلوم است)."
        mid: "مسئولیت‌ها تا حدی مشخص است."
        high: "کاملاً مشخص است (برای هر خروجی، یک مسئول نهاییِ معلوم وجود دارد)."
        source_ref: L2-Q4
        keyword_refs: [L2-K3]
        indicator: "شفافیت مسئول نهایی هر خروجی (RACI)"

  # ---------------- لایهٔ ۳ — جاری‌سازی (Implementation) ----------------
  - code: implementation
    title: جاری‌سازی
    description: "سنجش استقلال تیم و تغییر رفتار. سازه: میزان استقلال تیم در اجرای فرایندها و پایبندی به دستورالعمل‌ها در غیاب مالک."
    weight: 1.00
    questions:
      - code: l3q1
        text: "از ۰ تا ۱۰، اگر شما ۴ هفته متوالی غایب و از دسترس خارج باشید، کسب‌وکار چقدر می‌تواند بدون افت کیفیت به کارش ادامه دهد؟"
        critical: true
        response: range+text
        low: "اصلاً نمی‌تواند (کسب‌وکار کاملاً فلج می‌شود)."
        mid: "تا حدی ادامه می‌دهد، اما با اختلال و افت کیفیت زیاد."
        high: "کاملاً ادامه می‌دهد (بدون هیچ تغییری در کیفیت و حتی همراه با رشد)."
        source_ref: L3-Q1
        keyword_refs: [L3-K1, L3-K3]
        indicator: "آزمون غیبت مدیر — تداوم عملیات بدون مالک"
      - code: l3q2
        text: "از ۰ تا ۱۰، کارکنان در طول روز چقدر برای تصمیم‌گیری‌های خرد یا گرفتن تأیید نهایی به شما مراجعه می‌کنند؟"
        polarity: reverse
        response: range+text
        low: "تقریباً هیچ (کمتر از ۳ بار در روز)."
        mid: "تا حدی (حدود ۳ تا ۱۰ بار در روز)."
        high: "بسیار زیاد (بیش از ۱۰ بار در روز)."
        source_ref: L3-Q2
        keyword_refs: [L3-K1, L3-K2]
        indicator: "فراوانی ارجاع تصمیم‌های خرد به مدیر (تفویض معکوس)"
      - code: l3q3
        text: "از ۰ تا ۱۰، تیم شما چقدر به دستورالعمل‌های مکتوب پایبند است و کارها را طبق آن‌ها انجام می‌دهد؟"
        response: range+text
        low: "اصلاً پایبند نیست (کارها کاملاً به روش‌های سلیقه‌ای و قدیمی انجام می‌شود)."
        mid: "تا حدی پایبند است (گاهی طبق دستورالعمل و گاهی دیمی عمل می‌کنند)."
        high: "کاملاً پایبند است (تیم همیشه به طور مستمر طبق دستورالعمل عمل می‌کند)."
        source_ref: L3-Q3
        keyword_refs: [L3-K1, L3-K2]
        indicator: "پایبندی رفتاری تیم به سیستم (فرهنگ سیستم‌پذیری)"
      - code: l3q4
        text: "از ۰ تا ۱۰، فرآیندها و آموزش‌های نوشته‌شده چقدر در عمل پیاده‌سازی و جاری شده‌اند؟"
        response: range+text
        low: "اصلاً جاری نشده‌اند (یا نوشته نشده‌اند یا کاملاً بایگانی شده و خاک می‌خورند)."
        mid: "بخشی از آن‌ها جاری شده و بخشی بایگانی است."
        high: "کاملاً جاری شده‌اند و در عمل روزمره استفاده می‌شوند."
        source_ref: L3-Q4
        keyword_refs: [L3-K1, L3-K2]
        indicator: "جاری‌شدن واقعی مستندات در رفتار روزمره"

  # ---------------- لایهٔ ۴ — نگهداشت و پایش (Maintenance) ----------------
  - code: maintenance
    title: نگهداشت و پایش
    description: "سنجش داشبوردها و رفع باگ‌ها. سازه: میزان پایش عددی عملکرد، انضباط جلسات، و یادگیری سازمانی از خطاها."
    weight: 1.00
    questions:
      - code: l4q1
        text: "از ۰ تا ۱۰، وضعیت کسب‌وکارتان چقدر با داشبورد عددی و شاخص‌های کلیدی (KPI) رصد می‌شود؟"
        critical: true
        response: range+text
        low: "اصلاً رصد نمی‌شود (فقط بر اساس حدس و گمان یا موجودی حساب رصد می‌شود)."
        mid: "تا حدی رصد می‌شود (با گزارش‌های پراکنده و غیرمنظم)."
        high: "کاملاً رصد می‌شود (با داشبورد منظم و شاخص‌های عددیِ هفتگی)."
        source_ref: L4-Q1
        keyword_refs: [L4-K1]
        indicator: "ابزار رصد وضعیت — داشبورد عددی در برابر شهود"
      - code: l4q2
        text: "از ۰ تا ۱۰، جلسات کاری تیم شما چقدر منظم، ساختاریافته و مسئله‌محور برگزار می‌شوند؟"
        response: range+text
        low: "اصلاً منظم نیست (فقط هنگام بروز مشکل یا بحران جلسه می‌گذاریم)."
        mid: "تا حدی منظم است (گاهی منظم و گاهی بی‌برنامه)."
        high: "کاملاً منظم است (جلسات روتین با دستورجلسه مشخص و پیگیری مصوبات)."
        source_ref: L4-Q2
        keyword_refs: [L4-K2]
        indicator: "ریتم منضبط جلسات پایش"
      - code: l4q3
        text: "از ۰ تا ۱۰، وقتی یک خطای تکراری در کیفیت یا ارائه خدمات رخ می‌دهد، واکنش سیستم چقدر سرزنش یا جریمه فرد است؟"
        polarity: reverse
        response: range+text
        low: "اصلاً جریمه نمی‌شود (همیشه خودِ فرآیند و سیستم بررسی و اصلاح می‌شود)."
        mid: "گاهی فرد سرزنش می‌شود و گاهی فرآیند بررسی می‌شود."
        high: "کاملاً جریمه می‌شود (واکنش اول، همیشه سرزنش یا جریمه فرد است)."
        source_ref: L4-Q3
        keyword_refs: [L4-K3]
        indicator: "واکنش به خطای تکراری (معکوس: سرزنش در برابر بررسی فرایند)"
      - code: l4q4
        text: "از ۰ تا ۱۰، سیستم گزارش‌دهی شما چقدر می‌تواند انحراف از اهداف را به صورت خودکار هشدار دهد؟"
        response: range+text
        low: "اصلاً هشدار نمی‌دهد (حتماً باید پیگیری و پرس‌وجوی دستی انجام شود)."
        mid: "تا حدی هشدار می‌دهد (گزارش‌ها و هشدارها گاهی دستی و غیرمنظم ارسال می‌شوند)."
        high: "کاملاً خودکار هشدار می‌دهد (انحراف‌ها به موقع و بدون نیاز به پرس‌وجو مشخص می‌شوند)."
        source_ref: L4-Q4
        keyword_refs: [L4-K1, L4-K3]
        indicator: "خودکار بودن گزارش‌دهی و هشدار انحراف"

  # ---------------- لایهٔ ۵ — توسعه و مقیاس (Scaling) ----------------
  - code: scaling
    title: توسعه و مقیاس‌پذیری
    description: "سنجش پتانسیل تکثیر و رشد نمایی. سازه: توان مقیاس‌پذیری عملیات، قابلیت تکثیر مدل بدون مالک، و اقتصاد واحد."
    weight: 1.00
    questions:
      - code: l5q1
        text: "از ۰ تا ۱۰، اگر حجم سفارش‌ها یا مشتریان شما در ماه آینده ۳ برابر شود، کسب‌وکارتان چقدر توانایی پاسخگویی (بدون افت کیفیت) را دارد؟"
        critical: true
        response: range+text
        low: "اصلاً ندارد (سیستم از هم می‌پاشد و کیفیت شدیداً افت می‌کند)."
        mid: "تا حدی دارد (اما فقط با جذب سریع نیروهای جدید ممکن است)."
        high: "کاملاً دارد (سیستم آماده است و به راحتی بزرگ می‌شود)."
        source_ref: L5-Q1
        keyword_refs: [L5-K2, L5-K3]
        indicator: "آزمون سه‌برابرشدن حجم — کشش سیستم"
      - code: l5q2
        text: "از ۰ تا ۱۰، مدل کسب‌وکارتان چقدر قابلیت تکثیر (افتتاح شعبه، نمایندگی یا خط درآمد جدید) بدون حضور مستقیم شما را دارد؟"
        response: range+text
        low: "اصلاً قابلیت تکثیر ندارد."
        mid: "فقط با حضور و دخالت زیادِ خود من قابل تکثیر است."
        high: "کاملاً بدون حضور مستقیم من قابل تکثیر است."
        source_ref: L5-Q2
        keyword_refs: [L5-K1, L5-K2]
